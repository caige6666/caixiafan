/* ================= 点单 ================= */
const OLS = { cart:'cxF_cart', sent:'cxF_sent', recv:'cxF_recv' };
function loadJ(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function saveJ(k, v){ localStorage.setItem(k, JSON.stringify(v)); }

function orderCart(){ return loadJ(OLS.cart, []); }
function orderCartCount(){ return orderCart().length; }
function addToCart(id){
  const r = R[id]; if(!r) return;
  const cart = orderCart();
  if(cart.some(x=>x.id===id)){ toast('这道菜已经在点单里了'); return; }
  cart.push({id:id, name:r.name, meal:r.meal, img:r.img, time:r.time});
  saveJ(OLS.cart, cart);
}
function removeFromCart(id){
  saveJ(OLS.cart, orderCart().filter(x=>x.id!==id));
}
function placeOrder(){
  const cart = orderCart();
  if(!cart.length) return null;
  const ord = {
    orderId: Date.now().toString(36).toUpperCase().slice(-5) + Math.floor(Math.random()*36).toString(36).toUpperCase(),
    time: new Date().toLocaleString('zh-CN', {hour12:false}),
    items: cart
  };
  const sent = loadJ(OLS.sent, []);
  sent.unshift(ord);
  saveJ(OLS.sent, sent.slice(0,10));
  saveJ(OLS.cart, []);
  return ord;
}
function makeOrderText(ord){
  return '【菜很下饭·点单】#v1#' + JSON.stringify({
    orderId:ord.orderId, time:ord.time,
    items:ord.items.map(i=>({id:i.id,name:i.name,meal:i.meal,img:i.img,time:i.time}))
  });
}
function parseOrderText(txt){
  const m = /【菜很下饭·点单】#v1#(\{[\s\S]*\})/.exec(String(txt||'').trim());
  if(!m) return null;
  try{
    const o = JSON.parse(m[1]);
    if(!o || !Array.isArray(o.items) || !o.items.length) return null;
    return {
      orderId: o.orderId || ('OD'+Date.now().toString(36).toUpperCase()),
      time: o.time || new Date().toLocaleString('zh-CN',{hour12:false}),
      items: o.items.filter(i=>R[i.id])
    };
  }catch(e){ return null; }
}
function recvOrders(){ return loadJ(OLS.recv, []); }
function saveRecv(list){ saveJ(OLS.recv, list.slice(0,30)); }
function addRecvOrder(ord){
  if(!ord || !ord.items || !ord.items.length) return false;
  const list = recvOrders();
  if(list.some(o=>o.orderId===ord.orderId)) return false;
  list.unshift({orderId:ord.orderId, time:ord.time, status:'new', items:ord.items});
  saveRecv(list);
  return true;
}
function setOrderStatus(orderId, status){
  saveRecv(recvOrders().map(o=>o.orderId===orderId ? Object.assign({},o,{status:status}) : o));
}
function sumIngredients(items){
  const map = {};
  for(const it of items){
    const r = R[it.id]; if(!r) continue;
    for(const g of r.ingredients){
      if(!map[g.n]) map[g.n] = {count:0, amts:[]};
      map[g.n].count++;
      if(map[g.n].amts.indexOf(g.a) < 0) map[g.n].amts.push(g.a);
    }
  }
  return Object.entries(map)
    .map(([n,v])=>({n, count:v.count, amts:v.amts.slice(0,2).join('、')}))
    .sort((a,b)=>b.count-a.count || a.n.localeCompare(b.n,'zh'));
}
const STATUS_META = { new:{txt:'待接单',cls:'new'}, doing:{txt:'制作中',cls:'doing'}, done:{txt:'已完成',cls:'done'} };

/* ---- 实时点单（好友制 P2P） ---- */
let peer = null, conns = {}, retryTimer = null, qrMade = null, pendingAdd = null;
const SECURE = /^https:/.test(location.protocol) || /^(localhost|127\.0\.0\.1)(:\d+)?$/.test(location.hostname);
function myFriendId(){
  let id = localStorage.getItem('cxF_myid');
  if(!id){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for(let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
    id = 'CNXF-'+s;
    localStorage.setItem('cxF_myid', id);
  }
  return id;
}
function normId(id){ return String(id||'').trim().toUpperCase().replace(/^CNXF-/,''); }
function friendList(){ return loadJ('cxF_friends', []); }
function saveFriends(list){ saveJ('cxF_friends', list.slice(0,50)); }
function addFriend(id){
  id = normId(id);
  if(!id) return false;
  const list = friendList();
  if(!list.some(f=>f.id===id)){ list.push({id, at: new Date().toLocaleString('zh-CN',{hour12:false})}); saveFriends(list); }
  return true;
}
function removeFriend(id){
  id = normId(id);
  saveFriends(friendList().filter(f=>f.id!==id));
  const c = conns[id]; if(c){ try{ c.close(); }catch(e){} delete conns[id]; }
  updateConnUI();
}
function pendingOrders(){ return loadJ('cxF_pending', []); }
function savePending(list){ saveJ('cxF_pending', list.slice(0,100)); }
function destroyPeer(){
  try{ if(peer) peer.destroy(); }catch(e){}
  peer = null; conns = {};
}
function openPeer(){
  if(!SECURE) return;
  if(typeof Peer === 'undefined') return;
  if(peer && !peer.destroyed) return;
  try{
    peer = new Peer('cnxf-'+myFriendId());
    peer.on('open', () => { updateConnUI(); connectAll(); });
    peer.on('connection', conn => {
      const fid = normId(conn.peer);
      addFriend(fid);
      conns[fid] = conn;
      conn.on('data', onPeerData);
      conn.on('close', () => { if(conns[fid]===conn) delete conns[fid]; updateConnUI(); });
      conn.on('error', () => { if(conns[fid]===conn) delete conns[fid]; updateConnUI(); });
      flushPending(fid);
      updateConnUI();
      if(state.route==='order') renderOrder();
    });
    peer.on('disconnected', () => { if(peer) try{ peer.reconnect(); }catch(e){} });
    peer.on('error', () => {});
  }catch(e){}
}
function connectTo(id){
  if(!SECURE || typeof Peer === 'undefined') return;
  id = normId(id);
  if(!id) return;
  if(conns[id] && conns[id].open) return;
  if(!peer || !peer.open || peer.destroyed) return;
  try{
    const conn = peer.connect('cnxf-'+id, {reliable:true});
    conns[id] = conn;
    conn.on('open', () => { flushPending(id); updateConnUI(); });
    conn.on('data', onPeerData);
    conn.on('close', () => { if(conns[id]===conn) delete conns[id]; updateConnUI(); });
    conn.on('error', () => { if(conns[id]===conn) delete conns[id]; updateConnUI(); });
  }catch(e){}
}
function connectAll(){ friendList().forEach(f => connectTo(f.id)); }
function startRetry(){
  if(retryTimer) return;
  retryTimer = setInterval(() => {
    if(!SECURE || typeof Peer === 'undefined') return;
    if(!peer || peer.destroyed){ openPeer(); return; }
    friendList().forEach(f => { if(!(conns[f.id] && conns[f.id].open)) connectTo(f.id); });
  }, 30000);
}
function addFriendAndConnect(id){
  if(!addFriend(id)) return;
  connectTo(id);
  toast('已添加好友，对方上线后自动连接');
  renderOrder();
}
function flushPending(id){
  id = normId(id);
  const list = pendingOrders();
  if(!list.length) return;
  const c = conns[id];
  if(!(c && c.open)) return;
  const rest = [];
  list.forEach(p => {
    if(p.to === id){ try{ c.send({type:'order', order:p.order}); }catch(e){ rest.push(p); } }
    else rest.push(p);
  });
  savePending(rest);
}
function qrTarget(id){
  const base = location.href.split('#')[0];
  if(/^https?:/.test(base)) return base + '#/order?addfriend=' + id;
  return 'CNXF-ADD:' + id;
}
function showQr(id){
  const wrap = $('#qrWrap'); if(!wrap) return;
  const box = $('#qrBox');
  const target = qrTarget(id);
  box.innerHTML = '';
  try{
    if(typeof QRCode === 'undefined') throw new Error('no qr lib');
    if(qrMade) qrMade.clear();
    qrMade = new QRCode(box, { text: target, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){
    box.innerHTML = '<div style="padding:60px 0;font-size:12px;color:#999">二维码组件未加载</div>';
  }
  $('#qrCodeTxt').textContent = id;
  $('#qrTip').innerHTML = /^https?:/.test(target)
    ? '对方用微信/相机<b>扫一扫</b>，打开本应用即自动加为好友；加一次永久有效，不用每次开房间。'
    : '本地打开时显示的是好友码文本，让对方在「添加好友」里输入即可；<b>部署到网页后</b>扫码可直接添加。';
  wrap.classList.add('show');
}
function hideQr(){
  const wrap = $('#qrWrap');
  if(wrap) wrap.classList.remove('show');
}
function onPeerData(d){
  if(d && d.type==='order' && d.order && addRecvOrder(d.order)){
    toast('收到新点单！');
    if(state.route==='order') renderOrder();
  }
}
function sendOrderViaPeer(ord){
  let sent = 0;
  const pending = pendingOrders();
  friendList().forEach(f => {
    const c = conns[f.id];
    if(c && c.open){ try{ c.send({type:'order', order:ord}); sent++; }catch(e){ pending.push({to:f.id, order:ord}); } }
    else pending.push({to:f.id, order:ord});
  });
  savePending(pending);
  return sent;
}
function updateConnUI(){
  if(state.route!=='order') return;
  const el = $('#connTxt'); if(!el) return;
  const dot = $('#connDot');
  const online = Object.keys(conns).filter(id => conns[id] && conns[id].open).length;
  if(dot) dot.classList.toggle('on', online > 0);
  const fl = friendList();
  if(!SECURE) el.innerHTML = '本地打开：<b>实时连接不可用</b>，点菜下单后复制文本发给对方即可。';
  else if(online > 0) el.innerHTML = '已连接 <b>'+online+'</b> 位好友，点单实时送达；离线好友上线后自动补送。';
  else if(peer && peer.open) el.innerHTML = '你好友码 <b>'+myFriendId()+'</b> · 好友 '+fl.length+' 人，等待连接…';
  else if(peer) el.innerHTML = '连接中…';
  else el.innerHTML = '实时点单：展示好友码让对方扫码，或输入对方好友码添加。';
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>{}, ()=>{ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

  location.hash = '#/' + (t==='home' ? '' : t);
}));
$('#refreshBtn').addEventListener('click', () => {
  if(parseRoute().name==='home'){ animateRefresh(state.curMeal); }
});
window.addEventListener('keydown', e => {
  const r = parseRoute();
  if(r.name==='home'){
    if(e.key==='ArrowRight'){ animateSwitch(state.curMeal, +1, 'left'); }
    else if(e.key==='ArrowLeft'){ animateSwitch(state.curMeal, -1, 'right'); }
    else if(e.key.toLowerCase()==='r'){ animateRefresh(state.curMeal); }
    else if(e.key==='Enter'){ location.hash = '#/recipe/' + currentId(state.curMeal); }
  }
});
// 阻止卡片图片拖拽
document.addEventListener('dragstart', e => e.preventDefault());

router();

// PWA 离线支持：仅 HTTPS 环境下注册（本地 file:// 打开时自动跳过，不影响使用）
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      nw.addEventListener('statechange', function(){
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          toast('发现新版本，刷新页面后生效');
        }
      });
    });
  }).catch(function(){});
}
</script>
</body>
</html>
