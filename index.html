<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>菜很下饭 · 按时段食谱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F6B4F'/%3E%3Cpath d='M12 40h40a20 20 0 0 1-40 0z' fill='%23F8F4EC'/%3E%3Cpath d='M22 26c0-4 3-6 3-9M32 26c0-4 3-6 3-9M42 26c0-4 3-6 3-9' stroke='%23F8F4EC' stroke-width='3.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F6B4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="菜很下饭">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F6F1E7;
  --card:#FFFFFF;
  --ink:#26342B;
  --ink-2:#74816F;
  --line:#E7DFD0;
  --accent:#E05B33;
  --accent-soft:#FCE8DE;
  --gold:#E8A33D;
  --green:#2F6B4F;
  --green-soft:#E3EDE4;
  --red:#D94A3D;
  --red-soft:#FBE5E1;
  --purple:#7C5CA8;
  --purple-soft:#EFE7F6;
  --shadow:0 10px 30px rgba(60,50,30,.10);
  --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
.serif{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100dvh;
  background:var(--paper);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 60px rgba(60,50,30,.12);
}
@media(min-width:560px){
  body{padding:24px 0}
  #app{border-radius:28px;min-height:calc(100dvh - 48px);overflow:hidden}
}
/* ===== top bar ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 10px;
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:38px;height:38px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-title{font-size:19px;font-weight:700;letter-spacing:1px}
.brand-sub{font-size:11px;color:var(--ink-2);margin-top:1px}
.top-right{display:flex;align-items:center;gap:8px}
.clock-chip{
  font-size:11.5px;color:var(--green);background:var(--green-soft);
  padding:6px 10px;border-radius:999px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.icon-btn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s,background .15s;flex-shrink:0;
}
.icon-btn:active{transform:scale(.92);background:var(--accent-soft)}
.icon-btn svg{width:19px;height:19px}
/* ===== main ===== */
main{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.view{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
/* ===== home ===== */
.meal-banner{padding:4px 18px 10px;flex-shrink:0}
.meal-row{display:flex;align-items:flex-end;gap:12px}
.meal-name{font-size:30px;font-weight:900;line-height:1.15}
.meal-name small{font-size:13px;font-weight:600;color:var(--ink-2);display:block;margin-top:3px;letter-spacing:2px}
.meal-count{font-size:11.5px;color:var(--ink-2);font-weight:500}
.meal-count b{color:var(--accent);font-size:13px;font-weight:700}
.countdown{
  margin-top:8px;display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--ink-2);
}
.countdown .bar{flex:1;height:5px;border-radius:99px;background:#E5DCC9;overflow:hidden}
.countdown .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .6s}
/* card stage */
.stage{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:2px 16px 0}
.card{
  position:relative;flex:1;min-height:0;border-radius:var(--radius);overflow:hidden;
  background:#000;box-shadow:var(--shadow);cursor:grab;touch-action:pan-y;
  will-change:transform;
}
.card.dragging{cursor:grabbing;transition:none}
.card .card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,10,0) 42%,rgba(20,20,10,.62) 100%)}
.card .fav-btn{
  position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:3;
  transition:transform .15s;
}
.card .fav-btn:active{transform:scale(.9)}
.card .fav-btn svg{width:21px;height:21px;stroke:var(--accent);fill:none}
.card .fav-btn.on svg{fill:var(--accent);stroke:var(--accent)}
.card-info{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 18px;color:#fff;z-index:2}
.card-info .tags{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tag{
  font-size:10.5px;padding:3px 9px;border-radius:99px;font-weight:500;
  background:rgba(255,255,255,.22);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.28);
}
.card-info h2{font-size:26px;font-weight:700;line-height:1.2;margin-bottom:6px;letter-spacing:.5px}
.card-info .desc{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.88);margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:14px;font-size:12px;color:rgba(255,255,255,.95)}
.meta span{display:flex;align-items:center;gap:5px}
.meta svg{width:14px;height:14px;opacity:.9}
.meta .dots{display:flex;gap:3px;align-items:center}
.meta .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.meta .dots i.on{background:var(--gold)}
/* stage footer */
.stage-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 4px 14px;flex-shrink:0;
}
.hint{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.hint svg{width:13px;height:13px}
.pos-chip{
  font-size:11.5px;color:var(--green);background:var(--green-soft);
  padding:5px 12px;border-radius:99px;font-weight:600;font-variant-numeric:tabular-nums;
}
/* refresh indicator */
.refresh-hint{
  position:absolute;top:0;left:16px;right:16px;height:56px;z-index:6;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:12.5px;color:var(--green);font-weight:600;opacity:0;transform:translateY(-100%);
  transition:opacity .25s,transform .25s;pointer-events:none;background:rgba(246,241,231,.92);
  border-radius:0 0 14px 14px;
}
.refresh-hint.show{opacity:1;transform:translateY(0)}
.refresh-hint svg{width:16px;height:16px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* slide animations */
@keyframes slideInLeft{from{opacity:.2;transform:translateX(60px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideInRight{from{opacity:.2;transform:translateX(-60px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideInUp{from{opacity:.25;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card.anim-left{animation:slideInLeft .32s cubic-bezier(.2,.8,.3,1)}
.card.anim-right{animation:slideInRight .32s cubic-bezier(.2,.8,.3,1)}
.card.anim-up{animation:slideInUp .36s cubic-bezier(.2,.8,.3,1)}
/* ===== library ===== */
.lib-head{padding:6px 18px 10px;flex-shrink:0}
.lib-title{font-size:24px;font-weight:900;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;
  transition:all .18s;flex-shrink:0;
}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.tab .cnt{opacity:.7;font-weight:500;font-size:11px;margin-left:3px}
.grid-wrap{flex:1;overflow-y:auto;padding:6px 16px 90px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lib-card{
  background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;
  box-shadow:0 3px 12px rgba(60,50,30,.07);transition:transform .15s;position:relative;
}
.lib-card:active{transform:scale(.97)}
.lib-card .img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#E9E2D2}
.lib-card .b{margin-top:-2px}
.lib-card .nm{font-size:14.5px;font-weight:600;padding:9px 10px 3px;line-height:1.3}
.lib-card .ft{display:flex;justify-content:space-between;align-items:center;padding:0 10px 10px}
.lib-card .tm{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.lib-card .tm svg{width:12px;height:12px}
.lib-card .fav-mini{
  width:28px;height:28px;border-radius:50%;border:none;background:var(--red-soft);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.lib-card .fav-mini svg{width:15px;height:15px;stroke:var(--red);fill:none}
.lib-card .fav-mini.on svg{fill:var(--red)}
/* ===== favorites ===== */
.fav-head{padding:6px 18px 10px;flex-shrink:0}
.fav-title{font-size:24px;font-weight:900;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.manage-btn{
  font-size:12px;font-weight:600;color:var(--ink-2);background:none;border:1px solid var(--line);
  padding:6px 12px;border-radius:99px;cursor:pointer;
}
.manage-btn:active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.cat-chip .x{
  width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;margin-left:2px;
}
.cat-chip.on .x{background:rgba(255,255,255,.35)}
.cat-chip .x svg{width:9px;height:9px}
.fav-sub{font-size:12px;color:var(--ink-2);margin-bottom:12px}
.cat-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-row::-webkit-scrollbar{display:none}
.cat-chip{
  padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;flex-shrink:0;
  display:flex;align-items:center;gap:6px;transition:all .18s;
}
.cat-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cat-chip .n{font-size:11px;opacity:.75;font-weight:500}
.cat-add{
  width:34px;height:34px;border-radius:99px;border:1px dashed var(--ink-2);
  background:transparent;color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.cat-add svg{width:16px;height:16px}
.empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--ink-2);padding:40px 30px;text-align:center;
}
.empty svg{width:56px;height:56px;opacity:.4}
.empty p{font-size:13px;line-height:1.8}
.empty .go-btn{
  margin-top:6px;padding:10px 22px;border-radius:99px;border:none;background:var(--accent);
  color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;
}
/* ===== detail ===== */
.detail{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;position:relative}
.detail-hero{position:relative;height:300px;flex-shrink:0}
.detail-hero img{width:100%;height:100%;object-fit:cover;display:block}
.detail-hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,10,.25) 0%,rgba(20,20,10,0) 30%,rgba(20,20,10,.7) 100%)}
.detail-hero .back-btn{
  position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:3;
}
.detail-hero .back-btn svg{width:20px;height:20px;color:var(--ink)}
.detail-hero .dt-fav{
  position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:3;
}
.detail-hero .dt-fav svg{width:20px;height:20px;stroke:var(--accent);fill:none}
.detail-hero .dt-fav.on svg{fill:var(--accent)}
.detail-hero .dt-title{position:absolute;left:0;right:0;bottom:0;padding:0 18px 18px;color:#fff;z-index:2}
.detail-hero .dt-title h2{font-size:28px;font-weight:900;margin-bottom:8px}
.detail-hero .dt-meta{display:flex;gap:12px;font-size:12px;flex-wrap:wrap}
.detail-hero .dt-meta span{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;backdrop-filter:blur(3px)}
.detail-hero .dt-meta svg{width:13px;height:13px}
.detail-body{padding:18px 18px 30px}
.dsec{margin-bottom:24px}
.dsec-h{
  display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;margin-bottom:12px;
}
.dsec-h .no{
  width:26px;height:26px;border-radius:9px;background:var(--green);color:#fff;font-size:13px;
  display:flex;align-items:center;justify-content:center;font-family:"Noto Sans SC",sans-serif;font-weight:700;
}
.dsec-h.sub .no{background:var(--accent)}
.desc-line{font-size:13.5px;line-height:1.9;color:#4C5847;background:var(--card);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 12px 12px 0}
.ing-list{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ing-row{
  display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
  border-bottom:1px dashed var(--line);font-size:13.5px;gap:12px;
}
.ing-row:last-child{border-bottom:none}
.ing-row .name{display:flex;align-items:center;gap:9px;font-weight:500}
.ing-row .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0}
.ing-row .amt{color:var(--ink-2);font-size:13px;white-space:nowrap}
.step-list{counter-reset:step;display:flex;flex-direction:column;gap:10px}
.step-item{
  display:flex;gap:13px;background:var(--card);border-radius:14px;padding:13px 14px;
  border:1px solid var(--line);align-items:flex-start;
}
.step-item .sn{
  width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.step-item p{font-size:13.5px;line-height:1.85;color:#3E4A3B}
.tips-box{
  background:var(--green-soft);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.9;
  color:#2E5B43;display:flex;gap:10px;
}
.tips-box svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}
.detail-nav{display:flex;gap:10px;margin-top:8px}
.detail-nav button{
  flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
}
.detail-nav button:active{background:var(--accent-soft)}
.detail-nav button svg{width:15px;height:15px}
/* ===== bottom nav ===== */
.bottom-nav{
  display:flex;flex-shrink:0;border-top:1px solid var(--line);background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;
  border:none;background:none;cursor:pointer;color:var(--ink-2);font-size:11px;font-weight:500;
  border-radius:12px;transition:color .15s;
}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-item.on{color:var(--accent);font-weight:700}
.nav-item.on svg{fill:var(--accent-soft);stroke-width:2}
/* ===== 点单 ===== */
.order-page{flex:1;overflow-y:auto;padding:4px 18px 28px;-webkit-overflow-scrolling:touch}
.conn-bar{
  display:flex;align-items:center;gap:9px;margin:12px 0 16px;padding:11px 13px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);
}
.conn-dot{width:9px;height:9px;border-radius:99px;background:#B9B3A4;flex-shrink:0}
.conn-dot.on{background:#3FA75B;box-shadow:0 0 0 4px rgba(63,167,91,.15)}
.conn-bar .txt{flex:1;font-size:12px;color:var(--ink-2);line-height:1.5;word-break:break-all}
.conn-bar .txt b{color:var(--ink)}
.conn-actions{display:flex;gap:7px;flex-shrink:0}
.mini-btn{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:11.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
.mini-btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.mini-btn:active{opacity:.8}
.mini-btn:disabled{opacity:.45;cursor:default}
.room-row{display:flex;gap:8px;margin-top:8px}
.room-row input{flex:1;min-width:0;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;outline:none;color:var(--ink);font-family:inherit}
.room-row input:focus{border-color:var(--green)}
.osec{margin-bottom:18px}
.osec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.osec-h .t{font-size:15.5px;font-weight:700}
.osec-h .t small{font-size:11px;color:var(--ink-2);font-weight:500;margin-left:6px}
.order-empty{text-align:center;color:var(--ink-2);font-size:12.5px;padding:26px 10px;background:var(--card);border:1px dashed var(--line);border-radius:16px;line-height:1.8}
.cart-item{display:flex;align-items:center;gap:11px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.cart-item img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0}
.cart-item .nm{flex:1;font-size:13.5px;font-weight:600}
.cart-item .tm{font-size:11px;color:var(--ink-2);margin-top:2px}
.cart-item .rm{border:none;background:none;color:var(--ink-2);cursor:pointer;padding:6px;font-size:16px}
.order-ops{display:flex;gap:9px;margin-top:4px}
.order-ops button{flex:1;padding:12px;border-radius:14px;border:none;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.order-ops .go{background:var(--accent);color:#fff}
.order-ops .go:disabled{background:var(--line);color:var(--ink-2)}
.order-ops .copy{background:var(--green-soft);color:var(--green)}
.order-ops .copy:disabled{background:var(--line);color:var(--ink-2)}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ord-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ord-h .oid{font-size:12.5px;font-weight:700}
.ord-h .otime{font-size:10.5px;color:var(--ink-2)}
.ord-h .ost{flex:1;text-align:right}
.st-chip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:99px}
.st-chip.new{background:var(--accent-soft);color:var(--accent)}
.st-chip.doing{background:#F6E3B8;color:#8A5B10}
.st-chip.done{background:var(--green-soft);color:var(--green)}
.ord-items{margin-bottom:10px}

.qr-wrap .qr-code{font-size:13px;font-weight:700;letter-spacing:1px}

.f-item .f-st{font-size:11px;color:var(--ink-2)}

.me-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px}

.log-head b{font-size:13.5px}

.log-item{font-size:12.5px;color:var(--ink-2);line-height:1.9}
.me-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0}
.me-row .ok{color:var(--green);font-weight:700;font-size:12.5px}
.me-tip{font-size:11.5px;color:var(--ink-2);line-height:1.7;margin-top:8px}
.fb-text{width:100%;min-height:78px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--ink);font-family:inherit;resize:vertical;box-sizing:border-box}

.dt-order .cnt{margin-left:auto;font-size:11px;background:var(--accent);color:#fff;border-radius:99px;padding:2px 9px;font-weight:700}
/* ===== sheet ===== */
.sheet-mask{
  position:fixed;inset:0;background:rgba(30,28,20,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;
}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;transform:translate(-50%,110%);bottom:0;width:100%;max-width:520px;z-index:41;
  background:#FDFBF5;border-radius:24px 24px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));
  transition:transform .32s cubic-bezier(.2,.8,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.18);
}
.sheet.show{transform:translate(-50%,0)}
.sheet .grip{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:17px;font-weight:700;text-align:center;margin-bottom:4px}
.sheet .sub{font-size:12px;color:var(--ink-2);text-align:center;margin-bottom:16px}
.sheet .cats{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.sheet .cc{
  padding:9px 15px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;
}
.sheet .cc.on{background:var(--accent);border-color:var(--accent);color:#fff}
.newcat{display:flex;gap:8px;margin-bottom:18px}
.newcat input{
  flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:13.5px;outline:none;color:var(--ink);font-family:inherit;
}
.newcat input:focus{border-color:var(--accent)}
.newcat button{
  padding:0 18px;border-radius:12px;border:none;background:var(--green);color:#fff;
  font-size:13px;font-weight:600;cursor:pointer;
}
.sheet .ok{
  width:100%;padding:14px;border-radius:14px;border:none;background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;
}
.sheet .del-cat{
  width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1px solid var(--red);background:none;
  color:var(--red);font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
}
.sheet .del-cat svg{width:14px;height:14px}
/* ===== toast / dialog ===== */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:60;
  background:rgba(34,46,36,.94);color:#fff;font-size:13px;padding:10px 20px;border-radius:99px;
  opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.2);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.dialog-mask{
  position:fixed;inset:0;background:rgba(30,28,20,.5);z-index:70;display:none;align-items:center;justify-content:center;padding:28px;
}
.dialog-mask.show{display:flex}
.dialog{
  width:100%;max-width:340px;background:#FDFBF5;border-radius:20px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.dialog h4{font-size:16px;font-weight:700;margin-bottom:10px;text-align:center}
.dialog p{font-size:13px;color:var(--ink-2);line-height:1.7;margin-bottom:16px;text-align:center}
.dialog input{
  width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:14px;outline:none;margin-bottom:16px;font-family:inherit;
}
.dialog input:focus{border-color:var(--accent)}
.dlg-btns{display:flex;gap:10px}
.dlg-btns button{
  flex:1;padding:12px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;
}
.dlg-btns .cancel{background:#EFE9DC;color:var(--ink-2)}
.dlg-btns .ok{background:var(--accent);color:#fff}
/* scrollbar */
.grid-wrap::-webkit-scrollbar,.detail::-webkit-scrollbar{width:0}
</style>
</head>

{"id": "s1a01", "meal": "breakfast", "name": "白粥", "img": "assets/s1_01.jpg", "time": 40, "diff": 1, "kcal": 120, "tags": ["养胃", "清淡", "快手"], "desc": "米香浓郁的经典白粥，温润养胃。", "ingredients": [{"n": "大米", "a": "80克"}, {"n": "糯米", "a": "20克"}, {"n": "清水", "a": "1000毫升"}, {"n": "葱花", "a": "少许"}, {"n": "盐", "a": "少许"}], "steps": ["大米淘洗干净，清水浸泡20分钟。", "锅中加水烧开，下入大米大火煮沸。", "转小火慢熬30分钟，期间不时搅拌防粘底。", "煮至米粒开花、汤汁浓稠即可出锅，可点少许盐。"], "tips": "滴几滴香油或加几滴白醋，粥更黏稠不易溢锅。"},

{"id": "s1a13", "meal": "breakfast", "name": "鲜虾云吞面", "img": "assets/s1_13.jpg", "time": 25, "diff": 2, "kcal": 380, "tags": ["港式", "鲜香", "管饱"], "desc": "竹升面配鲜虾云吞，汤鲜面筋道。", "ingredients": [{"n": "竹升面", "a": "100克"}, {"n": "鲜虾云吞", "a": "8只"}, {"n": "菜心", "a": "2棵"}, {"n": "高汤", "a": "500毫升"}, {"n": "大地鱼粉", "a": "少许"}, {"n": "盐", "a": "2克"}], "steps": ["高汤加盐、大地鱼粉煮开做汤底，盛入面碗。", "另起锅水烧开，下竹升面煮2分钟捞出过温水。", "原锅下云吞煮5分钟至浮起，菜心烫熟。", "面入碗，摆上云吞、菜心，浇入热汤即可。"], "tips": "竹升面煮后过一下温水，口感更弹牙不粘连。"},
{"id": "s1a14", "meal": "breakfast", "name": "葱油拌面", "img": "assets/s1_14.jpg", "time": 20, "diff": 1, "kcal": 420, "tags": ["上海味", "快手", "酱香"], "desc": "葱香酱汁裹满面条，简单又销魂。", "ingredients": [{"n": "细面条", "a": "150克"}, {"n": "小葱", "a": "6根"}, {"n": "生抽", "a": "20毫升"}, {"n": "老抽", "a": "5毫升"}, {"n": "白糖", "a": "5克"}, {"n": "食用油", "a": "30毫升"}], "steps": ["小葱切段，油温五成热下葱段，小火慢炸至焦香捞出。", "葱油中加生抽、老抽、白糖小火熬成酱汁。", "面条煮熟捞出，控干水分。", "趁热浇上酱汁拌匀，放上炸葱段即可。"], "tips": "炸葱一定要小火慢炸到焦褐，葱油才香，别炸糊发苦。"},
{"id": "s1a15", "meal": "breakfast", "name": "阳春面", "img": "assets/s1_15.jpg", "time": 15, "diff": 1, "kcal": 300, "tags": ["清淡", "快手", "经典"], "desc": "清汤一口鲜，葱花衬底的苏式光面。", "ingredients": [{"n": "细面条", "a": "120克"}, {"n": "猪油", "a": "8克"}, {"n": "生抽", "a": "10毫升"}, {"n": "葱花", "a": "5克"}, {"n": "盐", "a": "1克"}, {"n": "高汤或热水", "a": "400毫升"}], "steps": ["碗中放猪油、生抽、盐，冲入热高汤化开。", "锅中水烧开下细面，煮2-3分钟至断生。", "捞面入碗，浇入面汤。", "撒上葱花即可上桌。"], "tips": "猪油是灵魂，一定要趁热冲入，香气瞬间释放。"},
{"id": "s1a16", "meal": "breakfast", "name": "武汉热干面", "img": "assets/s1_16.jpg", "time": 15, "diff": 2, "kcal": 450, "tags": ["武汉味", "酱香", "管饱"], "desc": "麻酱香浓，酸豆角提味的过早招牌。", "ingredients": [{"n": "碱水面", "a": "150克"}, {"n": "芝麻酱", "a": "30克"}, {"n": "酸豆角", "a": "20克"}, {"n": "葱花", "a": "5克"}, {"n": "生抽", "a": "10毫升"}, {"n": "香油", "a": "5毫升"}, {"n": "辣椒油", "a": "5毫升"}], "steps": ["芝麻酱用香油澥开，加生抽调稀。", "碱水面煮至八分熟捞出，抖开晾凉拌少许油。", "吃前下锅烫30秒捞出控水。", "浇芝麻酱，撒酸豆角、葱花、辣椒油拌匀。"], "tips": "面要提前掸凉，吃前再烫，拌出来才筋道不坨。"},
{"id": "s1a17", "meal": "breakfast", "name": "四川担担面", "img": "assets/s1_17.jpg", "time": 25, "diff": 2, "kcal": 460, "tags": ["川味", "香辣", "下饭"], "desc": "肉臊香麻辣咸鲜，一碗上头。", "ingredients": [{"n": "细面条", "a": "150克"}, {"n": "猪肉末", "a": "80克"}, {"n": "芽菜", "a": "20克"}, {"n": "葱花", "a": "5克"}, {"n": "生抽", "a": "10毫升"}, {"n": "辣椒油", "a": "10毫升"}, {"n": "花椒粉", "a": "2克"}, {"n": "蒜末", "a": "5克"}], "steps": ["锅中少油下肉末炒散，加芽菜炒成肉臊盛出。", "碗底放生抽、辣椒油、花椒粉、蒜末、高汤。", "面条煮熟捞入碗中。", "铺上肉臊，撒葱花即可。"], "tips": "芽菜本身咸，炒肉臊时不必再加盐。"},
{"id": "s1a18", "meal": "breakfast", "name": "重庆小面", "img": "assets/s1_18.jpg", "time": 20, "diff": 2, "kcal": 420, "tags": ["川味", "麻辣", "快手"], "desc": "红油麻辣佐料打底，面条筋道过瘾。", "ingredients": [{"n": "鲜细面", "a": "150克"}, {"n": "青菜", "a": "2棵"}, {"n": "蒜泥", "a": "5克"}, {"n": "葱花", "a": "5克"}, {"n": "生抽", "a": "10毫升"}, {"n": "辣椒油", "a": "15毫升"}, {"n": "花椒油", "a": "3毫升"}, {"n": "榨菜末", "a": "10克"}], "steps": ["碗中放蒜泥、生抽、辣椒油、花椒油、榨菜末、高汤做底料。", "水开下面条煮2分钟，下青菜烫熟。", "捞面入碗，浇面汤。", "摆上青菜，撒葱花即可。"], "tips": "佐料要趁面汤热冲入，香味才能激发出来。"},
{"id": "s1a19", "meal": "breakfast", "name": "兰州牛肉拉面", "img": "assets/s1_19.jpg", "time": 30, "diff": 3, "kcal": 400, "tags": ["西北味", "汤鲜", "管饱"], "desc": "一清二白三红四绿，汤清肉香面筋道。", "ingredients": [{"n": "拉面", "a": "150克"}, {"n": "卤牛肉", "a": "50克"}, {"n": "牛骨汤", "a": "600毫升"}, {"n": "萝卜片", "a": "30克"}, {"n": "蒜苗香菜", "a": "10克"}, {"n": "辣椒油", "a": "5毫升"}, {"n": "盐", "a": "2克"}], "steps": ["牛骨汤加盐、萝卜片煮开。", "拉面煮熟捞出控水。", "热汤浇入面碗，摆上切薄的卤牛肉。", "撒蒜苗香菜，依喜好淋辣椒油。"], "tips": "汤要清亮，萝卜片先焯水煮去豆腥味再下汤。"},
{"id": "s1a20", "meal": "breakfast", "name": "煎饺", "img": "assets/s1_20.jpg", "time": 15, "diff": 1, "kcal": 320, "tags": ["香脆", "快手", "下酒"], "desc": "底部金黄焦脆，咬开汤汁滚烫。", "ingredients": [{"n": "速冻水饺", "a": "12只"}, {"n": "清水", "a": "100毫升"}, {"n": "食用油", "a": "10毫升"}, {"n": "黑芝麻", "a": "少许"}, {"n": "葱花", "a": "少许"}], "steps": ["平底锅倒油烧热，饺子摆入小火煎到底部微黄。", "倒入清水至饺子三分之一处，盖盖中火焖8分钟。", "待水分收干，底部焦脆。", "撒葱花、黑芝麻出锅。"], "tips": "冻饺子无需解冻直接煎，中途别开盖，冰花更均匀。"},
{"id": "s1a21", "meal": "breakfast", "name": "牛肉锅贴", "img": "assets/s1_21.jpg", "time": 40, "diff": 2, "kcal": 380, "tags": ["香脆", "多汁", "北方味"], "desc": "牛肉馅多汁，底部冰花酥脆。", "ingredients": [{"n": "饺子皮", "a": "300克"}, {"n": "牛肉末", "a": "250克"}, {"n": "洋葱", "a": "半个"}, {"n": "姜末", "a": "5克"}, {"n": "生抽 / 蚝油 / 白胡椒粉", "a": "适量"}, {"n": "食用油", "a": "10毫升"}, {"n": "面粉", "a": "1小勺"}], "steps": ["洋葱切碎炒软晾凉；牛肉末加姜末、生抽、蚝油、白胡椒粉和洋葱碎，搅打上劲。", "取饺子皮放馅，中间捏合、两端留口，包成长条锅贴。", "平底锅热油，锅贴竖排摆入，小火煎2分钟至底部微黄。", "面粉加水调成稀面粉水，倒入至锅贴一半高，盖盖焖8分钟。", "水分收干后底部形成金黄冰花，撒葱花倒扣出锅。"], "tips": "面粉水里加一小勺面粉，冰花更脆更整；全程中火，避免底部焦糊。"},
{"id": "s1a22", "meal": "breakfast", "name": "上海生煎包", "img": "assets/s1_22.jpg", "time": 25, "diff": 2, "kcal": 350, "tags": ["上海味", "多汁", "香脆"], "desc": "底脆顶软，咬开爆汁的鲜肉生煎。", "ingredients": [{"n": "生煎包", "a": "6只"}, {"n": "清水", "a": "150毫升"}, {"n": "食用油", "a": "10毫升"}, {"n": "黑芝麻", "a": "少许"}, {"n": "葱花", "a": "少许"}], "steps": ["平底锅刷油，包子褶口朝上摆入，小火煎2分钟。", "倒入清水至包子一半高，盖盖中火焖12分钟。", "待水收干，底部焦脆。", "撒黑芝麻、葱花，盛出即可。"], "tips": "吃生煎先咬个小口吸汤，小心烫嘴。"},
{"id": "s1a23", "meal": "breakfast", "name": "鲜肉大包", "img": "assets/s1_23.jpg", "time": 90, "diff": 2, "kcal": 300, "tags": ["家常", "管饱", "鲜香"], "desc": "暄软面皮裹满多汁肉馅。", "ingredients": [{"n": "中筋面粉", "a": "400克"}, {"n": "酵母", "a": "4克"}, {"n": "温水", "a": "210毫升"}, {"n": "猪肉末", "a": "300克"}, {"n": "姜末 / 葱花", "a": "适量"}, {"n": "生抽 / 料酒 / 盐 / 糖", "a": "适量"}], "steps": ["酵母用温水化开，倒入面粉揉成光滑面团，盖好发酵至两倍大（约1小时）。", "肉末加姜末、生抽、料酒、盐、糖，分次加少量水搅打上劲，拌入葱花。", "面团排气搓条切剂，擀成中间厚边缘薄的圆皮，包入肉馅捏出褶子收口。", "包好的包子盖布二次醒发15分钟。", "蒸锅水开后放入，大火蒸12分钟，关火焖3分钟再开盖。"], "tips": "关火后焖3分钟再开盖，包子不会因温差塌皮；肉馅打水后更嫩更多汁。"},
{"id": "s1a24", "meal": "breakfast", "name": "青菜香菇包", "img": "assets/s1_24.jpg", "time": 90, "diff": 2, "kcal": 240, "tags": ["素食", "清香", "低脂"], "desc": "菜馅翠绿香菇香，清淡不腻。", "ingredients": [{"n": "中筋面粉", "a": "400克"}, {"n": "酵母", "a": "4克"}, {"n": "温水", "a": "210毫升"}, {"n": "青菜", "a": "300克"}, {"n": "香菇", "a": "6朵"}, {"n": "香干", "a": "2块"}, {"n": "盐 / 香油 / 糖", "a": "适量"}], "steps": ["酵母温水化开和面，发酵至两倍大（约1小时）。", "青菜焯水挤干切碎，加香油拌匀锁水；香菇、香干切小丁，用少许油炒香晾凉。", "青菜碎、香菇香干丁加盐和少许糖拌匀成馅。", "面团切剂擀皮，包入素馅捏褶收口，二次醒发15分钟。", "水开上锅大火蒸10分钟，关火焖2分钟再开盖。"], "tips": "素包子别蒸太久，青菜才保持翠绿不发黄；菜馅先拌油再放盐，不出水。"},
{"id": "s1a25", "meal": "breakfast", "name": "豆沙包", "img": "assets/s1_25.jpg", "time": 90, "diff": 1, "kcal": 260, "tags": ["香甜", "儿童爱", "快手"], "desc": "红豆沙细腻绵甜，暄软可口。", "ingredients": [{"n": "中筋面粉", "a": "400克"}, {"n": "酵母", "a": "4克"}, {"n": "温水", "a": "210毫升"}, {"n": "红豆沙", "a": "300克"}, {"n": "白糖", "a": "15克"}], "steps": ["酵母温水化开，加糖和面，揉成光滑面团，发酵至两倍大（约1小时）。", "红豆沙搓成约30克一个的小球备用。", "面团排气搓条切剂，压成圆皮，包入豆沙球收口朝下。", "包好的豆沙包盖布二次醒发15分钟。", "水开上锅大火蒸10分钟，关火焖2分钟再开盖。"], "tips": "豆沙提前搓圆更好包；收口一定捏紧，蒸的时候才不会开口露馅。"},
{"id": "s1a26", "meal": "breakfast", "name": "奶香馒头", "img": "assets/s1_26.jpg", "time": 70, "diff": 1, "kcal": 220, "tags": ["奶香", "儿童爱", "快手"], "desc": "加入牛奶的馒头，松软微甜。", "ingredients": [{"n": "中筋面粉", "a": "400克"}, {"n": "酵母", "a": "4克"}, {"n": "牛奶", "a": "210毫升"}, {"n": "白糖", "a": "20克"}, {"n": "猪油", "a": "少许"}], "steps": ["牛奶隔水温热（不烫手），化开酵母和糖。", "面粉加牛奶酵母水和面，加少许猪油揉成光滑面团，发酵至两倍大。", "排气后充分揉匀，搓成长条，切成等份剂子，逐个搓圆整形。", "馒头胚盖布二次醒发15分钟。", "水开上锅大火蒸10分钟，关火焖2分钟再开盖。"], "tips": "冷馒头回蒸时表面洒点水，口感和新蒸一样软；加猪油馒头更白更光洁。"},
{"id": "s1a27", "meal": "breakfast", "name": "葱油花卷", "img": "assets/s1_27.jpg", "time": 70, "diff": 2, "kcal": 240, "tags": ["葱香", "家常", "快手"], "desc": "层层叠叠的葱香，咸香松软。", "ingredients": [{"n": "中筋面粉", "a": "400克"}, {"n": "酵母", "a": "4克"}, {"n": "温水", "a": "210毫升"}, {"n": "小葱", "a": "2根"}, {"n": "食用油", "a": "2勺"}, {"n": "盐 / 五香粉", "a": "适量"}], "steps": ["酵母温水化开和面，发酵至两倍大（约1小时）。", "小葱切碎，加油、盐、五香粉拌匀成葱油料。", "面团擀成长方形大薄片，均匀抹上葱油料。", "卷起成长条，切成小段，用筷子从中间压一下，拧成花卷生胚。", "二次醒发15分钟，水开上锅大火蒸10分钟，关火焖2分钟。"], "tips": "花卷底部垫一片胡萝卜片防粘，还能增香；葱花拌过油再卷，蒸出来不塌色。"},
{"id": "s1a28", "meal": "breakfast", "name": "葱油饼", "img": "assets/s1_28.jpg", "time": 20, "diff": 2, "kcal": 380, "tags": ["香脆", "家常", "快手"], "desc": "外酥里软，葱香扑鼻。", "ingredients": [{"n": "手抓饼胚", "a": "1张"}, {"n": "葱花", "a": "10克"}, {"n": "盐", "a": "1克"}, {"n": "食用油", "a": "少许"}, {"n": "椒盐", "a": "少许"}], "steps": ["平底锅小火预热，放入饼胚。", "一面煎至金黄翻面，约2分钟。", "撒葱花盐，继续煎至两面酥脆。", "出锅切角装盘。"], "tips": "用现成手抓饼胚最省事，锅中小火慢煎才外脆里软。"},
{"id": "s1a29", "meal": "breakfast", "name": "鸡蛋灌饼", "img": "assets/s1_29.jpg", "time": 15, "diff": 2, "kcal": 350, "tags": ["快手", "管饱", "街头味"], "desc": "饼皮鼓起灌入鸡蛋，香软可口。", "ingredients": [{"n": "鸡蛋灌饼胚", "a": "1张"}, {"n": "鸡蛋", "a": "1个"}, {"n": "葱花", "a": "5克"}, {"n": "甜面酱", "a": "10克"}, {"n": "生菜", "a": "1片"}, {"n": "火腿肠", "a": "1根"}], "steps": ["平底锅小火放饼胚，煎至鼓起。", "筷子挑开饼口，倒入打散的蛋液加葱花。", "翻面煎至蛋液凝固、两面金黄。", "刷甜面酱，卷生菜火腿即可。"], "tips": "饼一定要煎到自然鼓起再灌蛋，才不会漏液。"},
{"id": "s1a30", "meal": "breakfast", "name": "台湾手抓饼", "img": "assets/s1_30.jpg", "time": 10, "diff": 1, "kcal": 400, "tags": ["快手", "街头味", "管饱"], "desc": "层次酥脆，百搭卷一切。", "ingredients": [{"n": "手抓饼胚", "a": "1张"}, {"n": "鸡蛋", "a": "1个"}, {"n": "生菜", "a": "1片"}, {"n": "火腿肠", "a": "1根"}, {"n": "甜辣酱", "a": "10克"}], "steps": ["平底锅不放油，饼胚中小火煎至两面金黄酥脆。", "另起位置煎个蛋，火腿肠煎香。", "饼上刷甜辣酱，摆生菜、鸡蛋、火腿。", "卷起切段即可。"], "tips": "饼胚自带油脂，锅中不用再放油，小火慢煎层次才酥。"},
{"id": "s1a31", "meal": "breakfast", "name": "山东煎饼果子", "img": "assets/s1_31.jpg", "time": 20, "diff": 2, "kcal": 450, "tags": ["街头味", "管饱", "杂粮"], "desc": "薄脆夹中间，杂粮饼香软有嚼劲。", "ingredients": [{"n": "煎饼", "a": "1张"}, {"n": "鸡蛋", "a": "1个"}, {"n": "薄脆", "a": "1片"}, {"n": "葱花", "a": "5克"}, {"n": "甜面酱", "a": "10克"}, {"n": "生菜", "a": "1片"}], "steps": ["平底锅小火烧热，煎饼皮摊软。", "打一颗鸡蛋摊开，撒葱花。", "翻面，刷甜面酱，摆生菜、薄脆。", "卷起切段即可。"], "tips": "薄脆最后放，保持酥脆，泡久就软了。"},
{"id": "s1a32", "meal": "breakfast", "name": "陕西肉夹馍", "img": "assets/s1_32.jpg", "time": 20, "diff": 2, "kcal": 480, "tags": ["西北味", "解馋", "管饱"], "desc": "腊汁肉酥烂，白吉馍外酥里软。", "ingredients": [{"n": "白吉馍", "a": "2个"}, {"n": "腊汁肉", "a": "100克"}, {"n": "青椒", "a": "10克"}, {"n": "香菜", "a": "5克"}, {"n": "卤汁", "a": "10毫升"}, {"n": "白胡椒", "a": "少许"}], "steps": ["白吉馍预热至外脆。", "腊汁肉剁碎，拌入青椒末、香菜。", "烤好的馍从中间剖开不切断。", "夹入肉馅浇一勺卤汁即可。"], "tips": "肉要带点肥才香，剁碎时加一勺卤汁润口。"},
{"id": "s1a33", "meal": "breakfast", "name": "现磨豆浆", "img": "assets/s1_33.jpg", "time": 20, "diff": 1, "kcal": 120, "tags": ["高蛋白", "养胃", "快手"], "desc": "现磨无渣豆香，早餐标配。", "ingredients": [{"n": "黄豆", "a": "60克"}, {"n": "清水", "a": "800毫升"}, {"n": "糖", "a": "适量"}, {"n": "花生", "a": "10克"}, {"n": "红枣", "a": "3颗"}], "steps": ["黄豆浸泡6小时以上或隔夜。", "黄豆入豆浆机，加水至水位线。", "选豆浆模式打完约20分钟。", "倒出过滤，加糖调味即可。"], "tips": "豆子提前泡透，打出来更细腻，出浆率也高。"},
{"id": "s1a34", "meal": "breakfast", "name": "豆腐脑", "img": "assets/s1_34.jpg", "time": 15, "diff": 2, "kcal": 150, "tags": ["高蛋白", "清淡", "快手"], "desc": "嫩滑豆花浇卤汁，入口即化。", "ingredients": [{"n": "内酯豆腐", "a": "1盒"}, {"n": "紫菜", "a": "2克"}, {"n": "虾皮", "a": "2克"}, {"n": "葱花", "a": "5克"}, {"n": "生抽", "a": "10毫升"}, {"n": "香油", "a": "几滴"}, {"n": "水淀粉", "a": "适量"}], "steps": ["内酯豆腐倒扣入碗，上锅蒸5分钟取出。", "锅中加水、生抽烧开，淋水淀粉勾薄芡。", "卤汁浇在豆腐上，放紫菜、虾皮。", "撒葱花、淋香油即可。"], "tips": "盒装豆腐先蒸一下去豆腥，口感更紧实不易碎。"},
{"id": "s1a35", "meal": "breakfast", "name": "五香茶叶蛋", "img": "assets/s1_35.jpg", "time": 30, "diff": 1, "kcal": 80, "tags": ["快手", "零食", "高蛋白"], "desc": "裂纹渗透茶香咸香，越嚼越香。", "ingredients": [{"n": "鸡蛋", "a": "6个"}, {"n": "红茶", "a": "10克"}, {"n": "生抽", "a": "20毫升"}, {"n": "老抽", "a": "5毫升"}, {"n": "冰糖", "a": "10克"}, {"n": "八角", "a": "2颗"}, {"n": "桂皮", "a": "1小段"}], "steps": ["鸡蛋冷水下锅煮8分钟，捞出过凉水剥壳。", "蛋壳轻轻敲出裂纹。", "锅中放茶叶、香料、生抽、老抽、冰糖，加水煮开。", "放入鸡蛋小火煮20分钟，浸泡过夜更入味。"], "tips": "敲壳后浸泡一夜再吃，花纹漂亮味道更透。"},
{"id": "s1a36", "meal": "breakfast", "name": "水煮溏心蛋", "img": "assets/s1_36.jpg", "time": 10, "diff": 1, "kcal": 70, "tags": ["高蛋白", "快手", "低脂"], "desc": "蛋白凝固蛋黄流心，完美控时。", "ingredients": [{"n": "鸡蛋", "a": "2个"}, {"n": "清水", "a": "1000毫升"}, {"n": "凉白开", "a": "适量"}, {"n": "生抽", "a": "3毫升"}, {"n": "香醋", "a": "少许"}], "steps": ["水烧开，鸡蛋轻轻放入。", "计时6分30秒。", "立即捞出浸入冰水中降温。", "剥壳对半切开即可，可淋少许酱油。"], "tips": "室温蛋下锅，时间精确到秒，蛋黄才完美流心。"},
{"id": "s1a37", "meal": "breakfast", "name": "香煎荷包蛋", "img": "assets/s1_37.jpg", "time": 5, "diff": 1, "kcal": 90, "tags": ["快手", "高蛋白", "家常"], "desc": "边缘微焦蛋黄完整，百搭早餐。", "ingredients": [{"n": "鸡蛋", "a": "2个"}, {"n": "食用油", "a": "5毫升"}, {"n": "盐", "a": "1克"}, {"n": "黑胡椒", "a": "少许"}, {"n": "葱花", "a": "3克"}], "steps": ["平底锅小火倒油烧热。", "鸡蛋打入锅中，小火慢煎。", "蛋白凝固边缘微焦，撒盐和黑胡椒。", "喜欢溏心就单面煎，全熟翻面再煎30秒。"], "tips": "小火慢煎蛋白才嫩，火大边缘易焦苦。"},
{"id": "s1a38", "meal": "breakfast", "name": "法式吐司", "img": "assets/s1_38.jpg", "time": 10, "diff": 1, "kcal": 320, "tags": ["西式", "香甜", "快手"], "desc": "蛋奶液浸满吐司，外焦里嫩。", "ingredients": [{"n": "厚切吐司", "a": "2片"}, {"n": "鸡蛋", "a": "1个"}, {"n": "牛奶", "a": "50毫升"}, {"n": "黄油", "a": "10克"}, {"n": "蜂蜜", "a": "10克"}, {"n": "蓝莓", "a": "少许"}], "steps": ["鸡蛋打散加牛奶搅匀成蛋奶液。", "吐司浸入蛋奶液两面吸饱。", "平底锅放黄油融化，吐司两面各煎2分钟至金黄。", "装盘淋蜂蜜，配浆果即可。"], "tips": "吐司选厚切，浸泡时间别太长，否则煎时会散。"},
{"id": "s1a39", "meal": "breakfast", "name": "香蕉松饼", "img": "assets/s1_39.jpg", "time": 15, "diff": 2, "kcal": 280, "tags": ["儿童爱", "香甜", "低脂"], "desc": "香蕉天然甜，松软无油松饼。", "ingredients": [{"n": "熟香蕉", "a": "1根"}, {"n": "鸡蛋", "a": "1个"}, {"n": "低筋面粉", "a": "80克"}, {"n": "牛奶", "a": "50毫升"}, {"n": "泡打粉", "a": "2克"}, {"n": "蜂蜜", "a": "5克"}], "steps": ["香蕉压成泥，加鸡蛋、牛奶搅匀。", "筛入面粉、泡打粉拌匀成面糊。", "平底锅小火，舀一勺面糊摊圆。", "两面各煎2分钟至金黄，叠起淋蜂蜜香蕉片。"], "tips": "全程小火，表面出现小气泡再翻面，松饼更松软。"},
{"id": "s1a40", "meal": "breakfast", "name": "培根鸡蛋卷", "img": "assets/s1_40.jpg", "time": 10, "diff": 1, "kcal": 250, "tags": ["西式", "高蛋白", "快手"], "desc": "培根香煎卷蛋卷，咸香嫩滑。", "ingredients": [{"n": "鸡蛋", "a": "3个"}, {"n": "培根", "a": "2片"}, {"n": "牛奶", "a": "20毫升"}, {"n": "盐", "a": "1克"}, {"n": "黑胡椒", "a": "少许"}, {"n": "葱花", "a": "5克"}], "steps": ["培根切小块煎香盛出。", "鸡蛋打散加牛奶、盐、黑胡椒、葱花。", "平底锅小火倒蛋液，半凝固时放入培根。", "从一端卷起煎熟，切段装盘。"], "tips": "蛋液半凝固再卷，成品嫩滑不分层。"},
{"id": "s1a41", "meal": "snack", "name": "重庆酸辣粉", "img": "assets/s1_41.jpg", "time": 20, "diff": 2, "kcal": 400, "tags": ["川味", "酸辣", "解馋"], "desc": "红薯粉滑爽，酸辣开胃过瘾。", "ingredients": [{"n": "红薯粉条", "a": "150克"}, {"n": "花生米", "a": "20克"}, {"n": "榨菜末", "a": "10克"}, {"n": "葱花", "a": "5克"}, {"n": "生抽", "a": "15毫升"}, {"n": "陈醋", "a": "15毫升"}, {"n": "辣椒油", "a": "10毫升"}, {"n": "蒜泥", "a": "5克"}], "steps": ["粉条温水泡软，煮5分钟至透明。", "碗中放生抽、陈醋、辣椒油、蒜泥、高汤。", "捞入粉条，浇面汤。", "撒花生米、榨菜、葱花即可。"], "tips": "醋要最后加或直接放碗底，久煮香味挥发。"},
{"id": "s1a42", "meal": "snack", "name": "柳州螺蛳粉", "img": "assets/s1_42.jpg", "time": 20, "diff": 1, "kcal": 450, "tags": ["柳州味", "酸辣", "解馋"], "desc": "酸笋臭香浓郁，米粉爽滑上头。", "ingredients": [{"n": "螺蛳粉", "a": "1包"}, {"n": "酸笋", "a": "30克"}, {"n": "腐竹", "a": "10克"}, {"n": "花生米", "a": "10克"}, {"n": "青菜", "a": "1棵"}, {"n": "辣椒油", "a": "10毫升"}], "steps": ["米粉煮10分钟至软透捞出。", "另起锅煮料包汤底，加入酸笋煮开。", "米粉回锅烫热，放入青菜烫熟。", "连汤盛入碗，加腐竹、花生、辣椒油即可。"], "tips": "米粉多煮一会儿才软滑，别怕煮过头。"},
{"id": "s1a43", "meal": "snack", "name": "干炒牛河", "img": "assets/s1_43.jpg", "time": 15, "diff": 3, "kcal": 500, "tags": ["粤式", "镬气", "下饭"], "desc": "河粉干爽不黏，牛肉滑嫩镬气足。", "ingredients": [{"n": "河粉", "a": "250克"}, {"n": "牛肉", "a": "100克"}, {"n": "绿豆芽", "a": "50克"}, {"n": "葱段", "a": "20克"}, {"n": "生抽", "a": "15毫升"}, {"n": "老抽", "a": "5毫升"}, {"n": "料酒", "a": "5毫升"}, {"n": "淀粉", "a": "3克"}], "steps": ["牛肉切片用生抽、料酒、淀粉腌10分钟，大火滑炒盛出。", "锅留底油大火爆香葱段，下豆芽。", "下河粉快速翻炒，加生抽、老抽炒匀。", "倒回牛肉大火翻炒均匀出锅。"], "tips": "全程大火快炒，河粉提前挑散，出锅才干身不坨。"},
{"id": "s1a44", "meal": "snack", "name": "星洲炒米粉", "img": "assets/s1_44.jpg", "time": 20, "diff": 2, "kcal": 420, "tags": ["东南亚味", "咖喱香", "下饭"], "desc": "咖喱辛香配虾仁米粉，干爽够味。", "ingredients": [{"n": "米粉", "a": "150克"}, {"n": "虾仁", "a": "8只"}, {"n": "鸡蛋", "a": "1个"}, {"n": "胡萝卜丝", "a": "30克"}, {"n": "洋葱丝", "a": "30克"}, {"n": "咖喱粉", "a": "5克"}, {"n": "生抽", "a": "10毫升"}], "steps": ["米粉温水泡软沥干。", "鸡蛋炒熟盛出，虾仁炒至变色盛出。", "爆香洋葱胡萝卜，下咖喱粉炒香。", "下米粉、鸡蛋、虾仁大火快炒，加生抽调味。"], "tips": "米粉泡软后务必沥干水分，炒出来才干爽不坨。"},
{"id": "s1a45", "meal": "snack", "name": "扬州炒饭", "img": "assets/s1_45.jpg", "time": 15, "diff": 1, "kcal": 450, "tags": ["经典", "管饱", "下饭"], "desc": "配料丰富金包银，粒粒分明。", "ingredients": [{"n": "剩米饭", "a": "200克"}, {"n": "鸡蛋", "a": "1个"}, {"n": "火腿丁", "a": "30克"}, {"n": "青豆", "a": "20克"}, {"n": "胡萝卜丁", "a": "20克"}, {"n": "葱花", "a": "5克"}, {"n": "盐", "a": "3克"}], "steps": ["鸡蛋打散炒碎盛出。", "锅留底油下火腿丁、青豆、胡萝卜丁炒香。", "下米饭炒散，加鸡蛋，放盐调味。", "大火翻炒至米粒跳动，撒葱花出锅。"], "tips": "用隔夜冷饭最干爽，现煮饭太黏容易炒成一坨。"},
{"id": "s1a46", "meal": "snack", "name": "广式蛋炒饭", "img": "assets/s1_46.jpg", "time": 15, "diff": 1, "kcal": 430, "tags": ["粤式", "经典", "快手"], "desc": "腊味蛋香，粒粒裹蛋金黄诱人。", "ingredients": [{"n": "剩米饭", "a": "200克"}, {"n": "鸡蛋", "a": "1个"}, {"n": "腊肠丁", "a": "30克"}, {"n": "葱花", "a": "5克"}, {"n": "盐", "a": "2克"}, {"n": "生抽", "a": "3毫升"}], "steps": ["鸡蛋打散，米饭与蛋液拌匀。", "热锅冷油下腊肠丁炒香。", "倒入蛋液米饭大火快炒至粒粒金黄。", "加盐、少许生抽、葱花炒匀出锅。"], "tips": "蛋液先拌米饭再下锅，每粒米都能裹到蛋。"},
{"id": "s1a47", "meal": "snack", "name": "酱油蛋炒饭", "img": "assets/s1_47.jpg", "time": 10, "diff": 1, "kcal": 400, "tags": ["快手", "酱香", "家常"], "desc": "最简单的酱油炒饭，酱香浓郁。", "ingredients": [{"n": "剩米饭", "a": "200克"}, {"n": "鸡蛋", "a": "1个"}, {"n": "葱花", "a": "5克"}, {"n": "生抽", "a": "10毫升"}, {"n": "老抽", "a": "3毫升"}, {"n": "食用油", "a": "10毫升"}], "steps": ["鸡蛋炒熟拨到一边，下米饭炒散。", "沿锅边淋生抽、老抽，大火翻炒上色。", "翻炒至米粒均匀裹色、微微跳动。", "撒葱花出锅。"], "tips": "酱油沿锅边烹入，锅气激发酱香更足。"},
{"id": "s1a48", "meal": "snack", "name": "麻酱拌面", "img": "assets/s1_48.jpg", "time": 15, "diff": 1, "kcal": 450, "tags": ["北方味", "香浓", "快手"], "desc": "芝麻酱醇厚裹面，清凉滑爽。", "ingredients": [{"n": "面条", "a": "150克"}, {"n": "芝麻酱", "a": "30克"}, {"n": "黄瓜丝", "a": "30克"}, {"n": "花生米", "a": "10克"}, {"n": "生抽", "a": "10毫升"}, {"n": "香醋", "a": "5毫升"}, {"n": "蒜水", "a": "10毫升"}], "steps": ["芝麻酱用温水澥开，加生抽、香醋、蒜水调稀。", "面条煮熟过凉水沥干。", "浇上麻酱汁，撒黄瓜丝、花生米。", "拌匀即可。"], "tips": "芝麻酱要用温水分次调开，才顺滑不结块。"},
{"id": "s1a49", "meal": "snack", "name": "番薯糖水", "img": "assets/s1_49.jpg", "time": 30, "diff": 1, "kcal": 180, "tags": ["广式", "香甜", "暖胃"], "desc": "番薯软糯甜润，冬日暖身糖水。", "ingredients": [{"n": "红薯", "a": "300克"}, {"n": "姜", "a": "3片"}, {"n": "片糖", "a": "30克"}, {"n": "清水", "a": "800毫升"}, {"n": "红枣", "a": "3颗"}], "steps": ["红薯去皮切块，姜切片。", "锅中加水、姜片烧开。", "下红薯块，小火煮20分钟至软糯。", "加片糖煮化即可。"], "tips": "加两片姜中和寒性，秋冬喝更暖身。"},
{"id": "s1a50", "meal": "snack", "name": "陈皮红豆沙", "img": "assets/s1_50.jpg", "time": 90, "diff": 2, "kcal": 220, "tags": ["广式", "香甜", "养生"], "desc": "陈皮提香红豆沙绵密，广式糖水经典。", "ingredients": [{"n": "红小豆", "a": "100克"}, {"n": "陈皮", "a": "5克"}, {"n": "片糖", "a": "40克"}, {"n": "清水", "a": "1000毫升"}, {"n": "莲子", "a": "20克"}], "steps": ["红豆、陈皮提前浸泡2小时。", "所有食材入锅大火烧开。", "转小火慢熬1小时至豆皮开花。", "加片糖煮化，可部分压沙增加绵密度。"], "tips": "陈皮用十年老陈皮，香气层次更厚。"},
{"id": "s1a51", "meal": "snack", "name": "绿豆汤", "img": "assets/s1_51.jpg", "time": 40, "diff": 1, "kcal": 120, "tags": ["解暑", "低糖", "清凉"], "desc": "清热解暑，碧绿清爽夏日必备。", "ingredients": [{"n": "绿豆", "a": "100克"}, {"n": "清水", "a": "1000毫升"}, {"n": "冰糖", "a": "20克"}, {"n": "百合", "a": "10克"}, {"n": "莲子", "a": "15克"}], "steps": ["绿豆洗净浸泡30分钟。", "入锅加水大火烧开，转小火煮30分钟。", "加百合、冰糖煮10分钟。", "放凉冷藏后饮用更佳。"], "tips": "想汤色碧绿，别用铁锅，煮时别盖严盖子。"},
{"id": "s1a52", "meal": "snack", "name": "顺德双皮奶", "img": "assets/s1_52.jpg", "time": 40, "diff": 3, "kcal": 200, "tags": ["顺德味", "奶香", "甜品"], "desc": "水牛奶制成，双层奶皮嫩滑如凝脂。", "ingredients": [{"n": "全脂牛奶", "a": "250毫升"}, {"n": "蛋清", "a": "2个"}, {"n": "白糖", "a": "20克"}, {"n": "淡奶油", "a": "20毫升"}, {"n": "蜜红豆", "a": "10克"}], "steps": ["牛奶加热至微沸倒入碗中，晾凉结出第一层奶皮。", "沿边挑起奶皮，将奶液倒出与蛋清、糖搅匀过滤。", "再沿碗边倒回，奶皮浮起。", "封保鲜膜上锅小火蒸15分钟，晾凉凝固。"], "tips": "一定要用水牛奶或全脂奶，奶皮才厚才香。"},
{"id": "s1a53", "meal": "snack", "name": "姜撞奶", "img": "assets/s1_53.jpg", "time": 15, "diff": 2, "kcal": 160, "tags": ["广式", "暖胃", "甜品"], "desc": "老姜撞出奶香滑嫩，辛甜暖身。", "ingredients": [{"n": "全脂牛奶", "a": "200毫升"}, {"n": "老姜汁", "a": "15毫升"}, {"n": "白糖", "a": "15克"}, {"n": "红枣", "a": "2颗"}, {"n": "枸杞", "a": "少许"}], "steps": ["老姜榨出汁，碗底留15毫升。", "牛奶加糖加热至70度。", "牛奶从高处快速冲入姜汁中，别动。", "静置10分钟凝固即可。"], "tips": "牛奶温度控制在70度左右，撞出的奶才凝固。"},
{"id": "s1a54", "meal": "snack", "name": "梧州龟苓膏", "img": "assets/s1_54.jpg", "time": 30, "diff": 1, "kcal": 80, "tags": ["广式", "清热", "低脂"], "desc": "微苦回甘，配蜂蜜奶香滑爽。", "ingredients": [{"n": "龟苓膏粉", "a": "30克"}, {"n": "清水", "a": "500毫升"}, {"n": "蜂蜜", "a": "15克"}, {"n": "牛奶", "a": "50毫升"}, {"n": "炼乳", "a": "10毫升"}], "steps": ["龟苓膏粉用少量凉水调开。", "锅中水烧开，缓缓倒入粉糊搅拌。", "煮至透明冒泡，倒入容器晾凉凝固。", "切小块加蜂蜜、牛奶食用。"], "tips": "冷藏后食用更解暑，怕苦可多加蜂蜜。"},
{"id": "s1a55", "meal": "snack", "name": "杨枝甘露", "img": "assets/s1_55.jpg", "time": 20, "diff": 2, "kcal": 250, "tags": ["港式", "甜品", "水果"], "desc": "芒果西柚西米椰香，酸甜浓郁。", "ingredients": [{"n": "芒果", "a": "2个"}, {"n": "西柚", "a": "半个"}, {"n": "西米", "a": "50克"}, {"n": "椰浆", "a": "100毫升"}, {"n": "牛奶", "a": "100毫升"}, {"n": "冰糖", "a": "10克"}], "steps": ["西米煮至中间一点白，焖透明过凉水。", "一个芒果打成果泥，一个切粒。", "芒果泥加椰浆、牛奶搅匀。", "杯中放西米、芒果粒，浇果浆，顶部撒西柚粒。"], "tips": "西米焖好过冰水，口感更Q弹不粘。"},
{"id": "s1a56", "meal": "snack", "name": "椰汁西米露", "img": "assets/s1_56.jpg", "time": 30, "diff": 1, "kcal": 220, "tags": ["港式", "甜品", "清爽"], "desc": "西米Q弹配椰香，清凉解暑。", "ingredients": [{"n": "西米", "a": "80克"}, {"n": "椰浆", "a": "200毫升"}, {"n": "牛奶", "a": "100毫升"}, {"n": "冰糖", "a": "20克"}, {"n": "芒果", "a": "半个"}], "steps": ["水开下西米煮15分钟至中间一点白。", "关火焖10分钟至全透明，过凉水。", "椰浆、牛奶加冰糖煮开放凉。", "杯中放西米，浇椰奶，摆芒果粒。"], "tips": "西米煮后过冰水，粒粒分明更Q弹。"},
{"id": "s1a57", "meal": "snack", "name": "烤红薯", "img": "assets/s1_57.jpg", "time": 50, "diff": 1, "kcal": 280, "tags": ["香甜", "暖胃", "家常"], "desc": "外皮焦糖化，内里流蜜软糯。", "ingredients": [{"n": "红薯", "a": "2个约400克"}, {"n": "黄油", "a": "5克"}, {"n": "蜂蜜", "a": "10克"}, {"n": "白芝麻", "a": "少许"}, {"n": "肉桂粉", "a": "少许"}], "steps": ["红薯洗净擦干。", "烤箱预热220度。", "红薯摆入中层，烤40-50分钟。", "烤到表皮冒糖汁、捏着发软即可。"], "tips": "选细长的蜜薯，烤箱220度烤够时间才会流蜜。"},
{"id": "s1a58", "meal": "snack", "name": "卤味拼盘", "img": "assets/s1_58.jpg", "time": 60, "diff": 2, "kcal": 350, "tags": ["下酒", "解馋", "硬菜"], "desc": "卤汁浸透，鸡爪鸡蛋豆干样样入味。", "ingredients": [{"n": "鸡爪", "a": "200克"}, {"n": "鸡蛋", "a": "4个"}, {"n": "藕片", "a": "100克"}, {"n": "豆腐干", "a": "4块"}, {"n": "卤料包", "a": "1包"}, {"n": "生抽", "a": "30毫升"}, {"n": "老抽", "a": "10毫升"}, {"n": "冰糖", "a": "20克"}], "steps": ["鸡蛋煮熟剥壳，鸡爪剪去指甲焯水。", "锅中加水放卤料、生抽、老抽、冰糖煮开。", "先下耐煮食材，小火卤30分钟。", "再下易熟食材卤15分钟，浸泡1小时更入味。"], "tips": "关火浸泡过夜，比一直煮更入味。"},
{"id": "s1a59", "meal": "snack", "name": "关东煮", "img": "assets/s1_59.jpg", "time": 30, "diff": 1, "kcal": 180, "tags": ["日式", "暖身", "低脂"], "desc": "昆布鲣鱼高汤，萝卜竹轮吸满鲜汁。", "ingredients": [{"n": "鱼丸 / 竹轮 / 鱼豆腐", "a": "200克"}, {"n": "白萝卜", "a": "半根"}, {"n": "昆布", "a": "10克"}, {"n": "柴鱼片", "a": "10克"}, {"n": "生抽", "a": "15毫升"}, {"n": "味醂", "a": "10毫升"}, {"n": "盐", "a": "少许"}], "steps": ["昆布冷水泡20分钟，小火煮出味，加柴鱼片煮1分钟滤出高汤。", "高汤中加生抽、味醂、盐调味。", "白萝卜切厚片，先单独煮软。", "下鱼丸、竹轮、鱼豆腐等，小火煮15分钟，浸泡入味即可。"], "tips": "萝卜先单独煮软再入汤，才不会吸走鲜味；关火后多泡一会儿更入味。"},
{"id": "s1a60", "meal": "snack", "name": "章鱼小丸子", "img": "assets/s1_60.jpg", "time": 20, "diff": 2, "kcal": 350, "tags": ["日式", "街头味", "解馋"], "desc": "外脆内软章鱼粒弹牙，照烧酱香甜。", "ingredients": [{"n": "章鱼烧粉", "a": "100克"}, {"n": "鸡蛋", "a": "1个"}, {"n": "水", "a": "200毫升"}, {"n": "熟章鱼", "a": "80克"}, {"n": "卷心菜", "a": "30克"}, {"n": "照烧酱", "a": "20毫升"}, {"n": "木鱼花", "a": "5克"}, {"n": "沙拉酱", "a": "10毫升"}], "steps": ["章鱼烧粉加鸡蛋水调糊，章鱼切丁，卷心菜切碎。", "模具刷油烧热，倒糊至八分满。", "放章鱼丁、卷心菜，再补一层糊，转动煎至金黄。", "挤照烧酱、沙拉酱，撒木鱼花海苔碎。"], "tips": "面糊要现调现用，火候中火，不断翻转让球型圆滚。"},
{"id": "s2a01", "meal": "lunch", "name": "回锅肉", "img": "assets/s2_01.jpg", "time": 25, "diff": 2, "kcal": 480, "tags": ["川菜", "下饭菜", "经典"], "desc": "川菜之王，蒜苗豆瓣酱爆炒五花肉，肥而不腻", "ingredients": [{"n": "带皮五花肉", "a": "300克"}, {"n": "青蒜苗", "a": "3根"}, {"n": "郫县豆瓣酱", "a": "1.5汤匙"}, {"n": "姜片", "a": "3片"}, {"n": "料酒", "a": "1汤匙"}, {"n": "生抽", "a": "1汤匙"}, {"n": "白糖", "a": "半茶匙"}], "steps": ["五花肉冷水下锅，加姜片料酒煮20分钟至八成熟，捞出晾凉切薄片", "热锅少油，下肉片中火煸至边缘微卷出油，盛出备用", "底油下豆瓣酱小火炒出红油，回锅肉片翻炒上色", "加生抽、白糖调味，转大火下蒜苗段翻炒断生即可", "咸度够可不另加盐，豆瓣酱本身很咸"], "tips": "肉先煮后炒才不散，煸出多余油脂更香而不腻"},
{"id": "s2a02", "meal": "lunch", "name": "京酱肉丝", "img": "assets/s2_02.jpg", "time": 20, "diff": 2, "kcal": 420, "tags": ["京菜", "下饭菜", "甜咸"], "desc": "酱香浓郁的滑嫩肉丝，配豆皮葱丝卷着吃", "ingredients": [{"n": "猪里脊肉", "a": "250克"}, {"n": "甜面酱", "a": "2汤匙"}, {"n": "豆腐皮", "a": "2张"}, {"n": "葱白", "a": "2根"}, {"n": "蛋清", "a": "半个"}, {"n": "淀粉", "a": "1汤匙"}, {"n": "生抽", "a": "1汤匙"}, {"n": "白糖", "a": "1茶匙"}], "steps": ["里脊切丝，加蛋清、淀粉、少许盐抓匀腌制10分钟", "豆腐皮焯水切方片，葱白切丝铺盘底", "热锅凉油，下肉丝滑散至变色盛出", "底油炒香甜面酱，加生抽白糖少许水熬稠", "回锅肉丝翻炒裹匀酱汁，盛在葱丝上配豆皮卷食"], "tips": "肉丝顺纹切，腌制后滑油不粘锅更嫩滑"},

{"id": "s4a01", "meal": "dinner", "name": "土豆炖鸡块", "img": "assets/s4_01.jpg", "time": 40, "diff": 2, "kcal": 380, "tags": ["下饭菜", "家常"], "desc": "鸡肉软烂土豆粉糯，一锅浓香拌饭神器", "ingredients": [{"n": "鸡腿块", "a": "500克"}, {"n": "土豆", "a": "2个"}, {"n": "葱", "a": "1段"}, {"n": "姜", "a": "3片"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "1勺"}, {"n": "八角", "a": "2个"}, {"n": "冰糖", "a": "5克"}], "steps": ["鸡腿块冷水下锅加姜片料酒焯水，撇沫后捞出冲净。", "土豆切滚刀块，热油下冰糖炒出糖色，倒入鸡块翻炒上色。", "加葱姜八角、生抽老抽炒匀，倒入没过食材的热水。", "大火烧开转小火炖20分钟，加入土豆块继续炖15分钟。", "最后大火收浓汤汁，撒葱花出锅。"], "tips": "炖鸡用热水肉质不柴，最后再放盐避免肉紧缩。"},
{"id": "s4a02", "meal": "dinner", "name": "小鸡炖蘑菇", "img": "assets/s4_02.jpg", "time": 60, "diff": 2, "kcal": 360, "tags": ["东北菜", "炖菜"], "desc": "榛蘑吸满鸡汤鲜香，经典东北炖菜", "ingredients": [{"n": "小公鸡", "a": "半只"}, {"n": "榛蘑", "a": "50克"}, {"n": "粉条", "a": "1把"}, {"n": "葱段", "a": "适量"}, {"n": "姜片", "a": "适量"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "1勺"}, {"n": "料酒", "a": "1勺"}], "steps": ["榛蘑温水泡发洗净，粉条温水泡软，鸡剁块焯水捞出。", "热油爆香葱姜，下鸡块炒至表面微黄，加料酒生抽老抽。", "倒入没过鸡块的热水，大火烧开转小火炖30分钟。", "加入榛蘑继续炖15分钟，再下粉条煮5分钟。", "加盐调味，大火略收即可出锅。"], "tips": "干榛蘑比鲜蘑更香，泡蘑水沉淀后可滤入汤中增鲜。"},
{"id": "s4a03", "meal": "dinner", "name": "猪肉炖粉条", "img": "assets/s4_03.jpg", "time": 50, "diff": 2, "kcal": 450, "tags": ["东北菜", "下饭菜"], "desc": "五花肉油润粉条筋道，东北硬菜代表", "ingredients": [{"n": "五花肉", "a": "300克"}, {"n": "红薯粉条", "a": "1把"}, {"n": "大白菜", "a": "3叶"}, {"n": "葱段", "a": "适量"}, {"n": "姜片", "a": "适量"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "1勺"}, {"n": "八角", "a": "1个"}], "steps": ["五花肉切厚片，粉条温水泡软，白菜切段。", "热锅下五花肉片煸出油脂，加葱姜八角炒香。", "烹入料酒生抽老抽上色，加没过肉的热水大火烧开。", "转小火炖20分钟至肉软烂，下白菜和粉条炖10分钟。", "加盐调味，汤汁浓稠出锅。"], "tips": "粉条后放且别久煮，不然会糊锅粘成一团。"},
{"id": "s4a04", "meal": "dinner", "name": "排骨炖豆角", "img": "assets/s4_04.jpg", "time": 50, "diff": 2, "kcal": 380, "tags": ["家常", "炖菜"], "desc": "排骨脱骨豆角软烂，家常下饭炖菜", "ingredients": [{"n": "猪排骨", "a": "400克"}, {"n": "豆角", "a": "300克"}, {"n": "土豆", "a": "1个"}, {"n": "葱段", "a": "适量"}, {"n": "姜片", "a": "适量"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "1勺"}, {"n": "八角", "a": "1个"}], "steps": ["排骨剁块冷水下锅焯水，撇沫捞出冲净。", "豆角去筋掰段，土豆切滚刀块。", "热油爆香葱姜八角，下排骨炒至微黄，加生抽老抽。", "加热水没过排骨，大火烧开转小火炖25分钟。", "下豆角土豆继续炖15分钟，加盐收浓汤汁。"], "tips": "豆角一定要炖熟透，生豆角含毒素易引起不适。"},
{"id": "s4a05", "meal": "dinner", "name": "萝卜炖牛腩", "img": "assets/s4_05.jpg", "time": 100, "diff": 2, "kcal": 320, "tags": ["滋补", "暖身"], "desc": "牛腩酥烂萝卜清甜，汤清味厚暖身菜", "ingredients": [{"n": "牛腩", "a": "400克"}, {"n": "白萝卜", "a": "半根"}, {"n": "姜片", "a": "4片"}, {"n": "葱段", "a": "适量"}, {"n": "料酒", "a": "1勺"}, {"n": "白胡椒粉", "a": "少许"}, {"n": "盐", "a": "适量"}, {"n": "香菜", "a": "少许"}], "steps": ["牛腩切小块冷水下锅，加料酒姜片焯水，撇沫捞出冲净。", "牛腩入锅加足量热水、葱姜，大火烧开转小火炖60分钟。", "白萝卜切滚刀块加入锅中，继续小火炖20分钟。", "炖至萝卜透明、牛腩用筷子能轻松扎透。", "加盐白胡椒粉调味，撒香菜出锅。"], "tips": "牛腩先炖后再加萝卜，萝卜久炖会散烂成糊。"},
{"id": "s4a06", "meal": "dinner", "name": "番茄土豆炖牛肉", "img": "assets/s4_06.jpg", "time": 90, "diff": 2, "kcal": 350, "tags": ["下饭菜", "番茄味"], "desc": "番茄浓郁牛肉酥烂，汤汁拌饭一绝", "ingredients": [{"n": "牛腩", "a": "400克"}, {"n": "番茄", "a": "3个"}, {"n": "土豆", "a": "2个"}, {"n": "洋葱", "a": "半个"}, {"n": "番茄酱", "a": "2勺"}, {"n": "姜片", "a": "适量"}, {"n": "盐", "a": "适量"}, {"n": "糖", "a": "少许"}], "steps": ["牛腩切块焯水捞出，番茄顶部划十字烫去皮切块。", "热油下洋葱炒香，加番茄块炒出沙，放番茄酱。", "倒入牛腩翻炒均匀，加热水没过食材，大火烧开转小火炖60分钟。", "加土豆块继续炖20分钟至软烂。", "加盐糖调味，大火略收汤汁。"], "tips": "番茄先炒出沙再加牛腩，红汤色泽更浓郁。"},
{"id": "s4a07", "meal": "dinner", "name": "酸菜炖白肉", "img": "assets/s4_07.jpg", "time": 45, "diff": 2, "kcal": 340, "tags": ["东北菜", "开胃"], "desc": "酸菜酸香白肉肥而不腻，东北经典", "ingredients": [{"n": "酸菜", "a": "300克"}, {"n": "五花肉", "a": "250克"}, {"n": "粉丝", "a": "1把"}, {"n": "葱段", "a": "适量"}, {"n": "姜片", "a": "适量"}, {"n": "八角", "a": "1个"}, {"n": "盐", "a": "适量"}, {"n": "白胡椒粉", "a": "少许"}], "steps": ["五花肉冷水下锅加葱姜八角煮20分钟，捞出切薄片。", "酸菜挤干水分切丝，热油下酸菜炒2分钟出香。", "将炒好的酸菜、白肉片入锅，加煮肉汤大火烧开。", "转小火炖15分钟，放入泡软的粉丝煮5分钟。", "加盐白胡椒调味出锅。"], "tips": "白肉用原汤炖不腻，酸菜先炒一下酸味更醇厚。"},
{"id": "s4a08", "meal": "dinner", "name": "羊肉炖萝卜", "img": "assets/s4_08.jpg", "time": 80, "diff": 2, "kcal": 330, "tags": ["暖身", "滋补"], "desc": "羊肉酥烂萝卜去膻，冬日暖身汤菜", "ingredients": [{"n": "羊排", "a": "400克"}, {"n": "白萝卜", "a": "半根"}, {"n": "姜片", "a": "4片"}, {"n": "葱段", "a": "适量"}, {"n": "料酒", "a": "1勺"}, {"n": "白胡椒粉", "a": "少许"}, {"n": "盐", "a": "适量"}, {"n": "香菜", "a": "少许"}], "steps": ["羊排剁块冷水下锅，加料酒姜片焯水，撇净血沫捞出冲净。", "羊肉入砂锅加足量热水、葱姜，大火烧开转小火炖50分钟。", "白萝卜切滚刀块加入，继续小火炖20分钟。", "炖至萝卜透明、羊肉软烂脱骨。", "加盐白胡椒粉，撒香菜出锅。"], "tips": "加几块甘蔗或山楂同炖，羊肉膻味更小肉更烂。"},
{"id": "s4a09", "meal": "dinner", "name": "啤酒炖排骨", "img": "assets/s4_09.jpg", "time": 50, "diff": 2, "kcal": 420, "tags": ["下饭菜", "啤酒香"], "desc": "啤酒代替水炖排骨，肉质酥烂带麦香", "ingredients": [{"n": "猪肋排", "a": "500克"}, {"n": "啤酒", "a": "1罐"}, {"n": "香菇", "a": "6朵"}, {"n": "葱段", "a": "适量"}, {"n": "姜片", "a": "适量"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "1勺"}, {"n": "冰糖", "a": "5克"}], "steps": ["排骨剁块冷水焯水，撇沫捞出冲净。", "热油下冰糖炒糖色，倒入排骨翻炒至上色。", "加葱姜香菇、生抽老抽炒匀，倒入整罐啤酒没过排骨。", "大火烧开转小火炖35分钟。", "最后大火收浓汤汁，撒葱花出锅。"], "tips": "用啤酒代替水，肉更嫩且自带麦香，盐最后放。"},
{"id": "s4a10", "meal": "dinner", "name": "糖醋排骨", "img": "assets/s4_10.jpg", "time": 45, "diff": 2, "kcal": 480, "tags": ["酸甜", "下饭菜"], "desc": "外酥里嫩酸甜适口，宴客硬菜", "ingredients": [{"n": "猪肋排", "a": "500克"}, {"n": "料酒", "a": "1勺"}, {"n": "生抽", "a": "2勺"}, {"n": "香醋", "a": "3勺"}, {"n": "白糖", "a": "4勺"}, {"n": "番茄酱", "a": "1勺"}, {"n": "熟芝麻", "a": "少许"}, {"n": "葱姜", "a": "适量"}], "steps": ["排骨剁小段冷水焯水，撇沫捞出，加葱姜料酒蒸20分钟至软。", "调糖醋汁：糖4醋3生抽2番茄酱1加少许水搅匀。", "热锅热油，下排骨煎至表面微黄。", "倒入糖醋汁，小火翻炒至汤汁浓稠裹满排骨。", "出锅撒熟芝麻即可。"], "tips": "糖醋比例 1糖0.7醋，先蒸后煎排骨更快酥软不柴。"},
{"id": "s4a11", "meal": "dinner", "name": "红烧排骨", "img": "assets/s4_11.jpg", "time": 50, "diff": 2, "kcal": 460, "tags": ["下饭菜", "家常"], "desc": "色泽红亮肉质酥烂，经典红烧味", "ingredients": [{"n": "猪肋排", "a": "500克"}, {"n": "冰糖", "a": "10克"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "半勺"}, {"n": "料酒", "a": "1勺"}, {"n": "葱段", "a": "适量"}, {"n": "姜片", "a": "适量"}, {"n": "八角", "a": "1个"}], "steps": ["排骨剁块冷水焯水，撇沫捞出冲净沥干。", "热油下冰糖小火炒至枣红色，倒入排骨翻炒上色。", "加葱姜八角、料酒生抽老抽炒匀。", "倒入没过排骨的热水，大火烧开转小火炖35分钟。", "开盖大火收浓汤汁，撒葱花出锅。"], "tips": "炒糖色全程小火，冒小泡立刻下肉，发苦就前功尽弃。"},
{"id": "s4a12", "meal": "dinner", "name": "板栗烧鸡", "img": "assets/s4_12.jpg", "time": 40, "diff": 2, "kcal": 420, "tags": ["秋季", "下饭菜"], "desc": "板栗粉糯鸡肉酱香，秋季时令菜", "ingredients": [{"n": "鸡腿", "a": "2个"}, {"n": "板栗", "a": "200克"}, {"n": "葱段", "a": "适量"}, {"n": "姜片", "a": "适量"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "半勺"}, {"n": "冰糖", "a": "5克"}, {"n": "料酒", "a": "1勺"}], "steps": ["板栗剪口焯水剥壳，鸡腿剁块焯水捞出。", "热油下冰糖炒色，倒入鸡块翻炒至微黄。", "加葱姜料酒生抽老抽，加热水没过鸡块炖15分钟。", "放入板栗继续炖15分钟至板栗粉糯。", "大火收浓汤汁出锅。"], "tips": "板栗先蒸5分钟再剥壳，完整不碎。"},
{"id": "s4a13", "meal": "dinner", "name": "芋头烧鸡", "img": "assets/s4_13.jpg", "time": 40, "diff": 2, "kcal": 400, "tags": ["下饭菜", "软糯"], "desc": "芋头绵软鸡肉入味，家常下饭组合", "ingredients": [{"n": "鸡腿", "a": "2个"}, {"n": "芋头", "a": "300克"}, {"n": "葱段", "a": "适量"}, {"n": "姜片", "a": "适量"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "半勺"}, {"n": "蒜", "a": "3瓣"}, {"n": "料酒", "a": "1勺"}], "steps": ["鸡腿剁块焯水，芋头去皮切滚刀块。", "热油下芋头块煎至表面微黄盛出。", "锅留底油爆香姜蒜，下鸡块炒至变色，加料酒生抽老抽。", "加热水炖15分钟，放入芋头再炖12分钟。", "加盐调味，大火收汁撒葱花。"], "tips": "芋头先煎不易碎，处理生芋头戴手套防手痒。"},
{"id": "s4a14", "meal": "dinner", "name": "魔芋烧鸭", "img": "assets/s4_14.jpg", "time": 50, "diff": 2, "kcal": 380, "tags": ["川味", "下饭菜"], "desc": "魔芋吸味鸭肉紧实，川味家常烧菜", "ingredients": [{"n": "鸭腿", "a": "2只"}, {"n": "魔芋", "a": "300克"}, {"n": "干辣椒", "a": "5个"}, {"n": "青蒜", "a": "2根"}, {"n": "姜", "a": "3片"}, {"n": "豆瓣酱", "a": "1勺"}, {"n": "生抽", "a": "2勺"}, {"n": "料酒", "a": "1勺"}], "steps": ["鸭肉剁块冷水焯水，魔芋切块焯水去碱味。", "热油下鸭肉煸出油至表面微黄，盛出备用。", "锅留底油炒香姜蒜干辣椒豆瓣酱，下鸭肉炒匀。", "加料酒生抽和热水，大火烧开转小火炖30分钟。", "下魔芋炖10分钟，撒青蒜段收汁出锅。"], "tips": "魔芋先焯水去碱水味，烧久更入味。"},
{"id": "s4a15", "meal": "dinner", "name": "啤酒烧鱼", "img": "assets/s4_15.jpg", "time": 30, "diff": 2, "kcal": 280, "tags": ["下饭菜", "鲜味"], "desc": "啤酒烧鱼去腥增鲜，鱼肉嫩而不腥", "ingredients": [{"n": "草鱼块", "a": "500克"}, {"n": "啤酒", "a": "1罐"}, {"n": "青椒", "a": "1个"}, {"n": "红椒", "a": "1个"}, {"n": "姜", "a": "3片"}, {"n": "蒜", "a": "4瓣"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "半勺"}], "steps": ["鱼块洗净用厨房纸吸干，加料酒姜片腌10分钟。", "热油将鱼块两面煎黄盛出。", "锅留底油爆香姜蒜，下青红椒块，倒入鱼块。", "倒入半罐啤酒和生抽老抽，中火烧12分钟。", "大火略收汤汁出锅。"], "tips": "鱼先煎再倒啤酒，肉嫩且无腥味，不要频繁翻动。"},
{"id": "s4a16", "meal": "dinner", "name": "紫菜蛋花汤", "img": "assets/s4_16.jpg", "time": 10, "diff": 1, "kcal": 60, "tags": ["快手", "低脂"], "desc": "3分钟快手汤，清淡鲜美", "ingredients": [{"n": "紫菜", "a": "1小把"}, {"n": "鸡蛋", "a": "1个"}, {"n": "虾皮", "a": "1小撮"}, {"n": "葱花", "a": "少许"}, {"n": "盐", "a": "适量"}, {"n": "香油", "a": "几滴"}, {"n": "清水", "a": "2碗"}], "steps": ["紫菜撕小块放碗底，鸡蛋打散备用。", "锅中加水烧开，放入虾皮煮1分钟。", "转小火将蛋液缓缓淋入，形成蛋花。", "加盐调味，关火后将汤冲入紫菜碗中。", "滴香油撒葱花即可。"], "tips": "蛋液沿锅边细流淋入，蛋花又薄又漂亮。"},
{"id": "s4a17", "meal": "dinner", "name": "番茄蛋花汤", "img": "assets/s4_17.jpg", "time": 15, "diff": 1, "kcal": 90, "tags": ["开胃", "快手"], "desc": "酸甜开胃，家家都会的家常汤", "ingredients": [{"n": "番茄", "a": "2个"}, {"n": "鸡蛋", "a": "2个"}, {"n": "葱花", "a": "少许"}, {"n": "盐", "a": "适量"}, {"n": "糖", "a": "少许"}, {"n": "香油", "a": "几滴"}, {"n": "清水", "a": "3碗"}], "steps": ["番茄切块，鸡蛋打散。", "热油下番茄块炒出红油出沙。", "加入清水大火烧开，煮3分钟。", "转小火淋入蛋液形成蛋花，加盐糖调味。", "撒葱花滴香油出锅。"], "tips": "番茄先炒出沙再加水，汤红味更浓。"},

{"id": "s4a19", "meal": "dinner", "name": "冬瓜丸子汤", "img": "assets/s4_19.jpg", "time": 25, "diff": 2, "kcal": 180, "tags": ["清淡", "暖胃"], "desc": "肉丸鲜嫩冬瓜清甜，清淡不腻", "ingredients": [{"n": "猪肉末", "a": "200克"}, {"n": "冬瓜", "a": "200克"}, {"n": "姜末", "a": "少许"}, {"n": "葱花", "a": "少许"}, {"n": "盐", "a": "适量"}, {"n": "白胡椒粉", "a": "少许"}, {"n": "生抽", "a": "半勺"}, {"n": "香油", "a": "几滴"}], "steps": ["肉末加姜末、盐、生抽、少许水搅打上劲。", "冬瓜去皮切薄片。", "锅中加水烧至微开，虎口挤入丸子，小火浸熟。", "放入冬瓜片煮5分钟至透明。", "加盐白胡椒，撒葱花滴香油出锅。"], "tips": "水别大开，小火浸出的丸子更弹嫩不松散。"},

{"id": "s4a24", "meal": "dinner", "name": "花生猪脚汤", "img": "assets/s4_24.jpg", "time": 120, "diff": 1, "kcal": 350, "tags": ["滋补", "胶原蛋白"], "desc": "猪脚软糯花生绵，浓香滋补汤", "ingredients": [{"n": "猪脚", "a": "1只"}, {"n": "花生米", "a": "100克"}, {"n": "姜片", "a": "4片"}, {"n": "葱段", "a": "适量"}, {"n": "料酒", "a": "1勺"}, {"n": "盐", "a": "适量"}, {"n": "白胡椒粉", "a": "少许"}], "steps": ["猪脚斩块冷水下锅，加料酒姜片焯水，刮净毛冲净。", "花生提前泡2小时。", "猪脚入砂锅加足量热水、葱姜，大火烧开转小火炖60分钟。", "加入花生继续炖40分钟至猪脚软糯。", "加盐白胡椒调味出锅。"], "tips": "猪脚冷水焯水并刮洗干净，汤才清爽不腥。"},
{"id": "s4a25", "meal": "dinner", "name": "黄豆猪脚汤", "img": "assets/s4_25.jpg", "time": 120, "diff": 1, "kcal": 360, "tags": ["滋补", "胶原蛋白"], "desc": "黄豆酥软猪脚胶质浓，奶白浓汤", "ingredients": [{"n": "猪脚", "a": "1只"}, {"n": "黄豆", "a": "100克"}, {"n": "姜片", "a": "4片"}, {"n": "葱段", "a": "适量"}, {"n": "料酒", "a": "1勺"}, {"n": "盐", "a": "适量"}, {"n": "白胡椒粉", "a": "少许"}], "steps": ["黄豆提前泡一夜，猪脚斩块焯水刮洗干净。", "猪脚入砂锅加热水、葱姜料酒，大火烧开转小火炖50分钟。", "加入泡好的黄豆继续炖50分钟。", "炖至汤色奶白、猪脚软糯。", "加盐白胡椒调味出锅。"], "tips": "黄豆泡透再炖，开花沙软，汤更浓白。"},
{"id": "s4a26", "meal": "dinner", "name": "老母鸡汤", "img": "assets/s4_26.jpg", "time": 120, "diff": 1, "kcal": 280, "tags": ["滋补", "汤"], "desc": "汤黄味浓鸡肉紧实，经典滋补老火汤", "ingredients": [{"n": "老母鸡", "a": "半只"}, {"n": "姜片", "a": "4片"}, {"n": "葱段", "a": "适量"}, {"n": "料酒", "a": "1勺"}, {"n": "红枣", "a": "3颗"}, {"n": "枸杞", "a": "少许"}, {"n": "盐", "a": "适量"}], "steps": ["老母鸡剁块冷水焯水，撇沫捞出冲净。", "鸡块入砂锅加足量热水、葱姜料酒，大火烧开。", "转小火慢炖90分钟，至汤色金黄。", "加入红枣再炖15分钟。", "加盐调味，撒枸杞出锅。"], "tips": "老母鸡一定要小火慢炖2小时，汤才黄香。"},

{"id": "s4a29", "meal": "dinner", "name": "竹笋鸡汤", "img": "assets/s4_29.jpg", "time": 70, "diff": 1, "kcal": 200, "tags": ["春季", "鲜"], "desc": "春笋脆嫩鸡汤鲜，开春第一鲜", "ingredients": [{"n": "三黄鸡", "a": "半只"}, {"n": "鲜竹笋", "a": "200克"}, {"n": "姜片", "a": "3片"}, {"n": "葱段", "a": "适量"}, {"n": "料酒", "a": "1勺"}, {"n": "盐", "a": "适量"}, {"n": "枸杞", "a": "少许"}], "steps": ["竹笋去壳切片，焯水去涩味；鸡块焯水冲净。", "鸡块入锅加热水、葱姜料酒，大火烧开转小火炖45分钟。", "放入焯好的竹笋继续炖15分钟。", "加盐调味。", "撒枸杞出锅。"], "tips": "竹笋先焯水去草酸和涩味，汤更清甜。"},
{"id": "s4a30", "meal": "dinner", "name": "鸭血粉丝汤", "img": "assets/s4_30.jpg", "time": 25, "diff": 2, "kcal": 200, "tags": ["小吃", "金陵味"], "desc": "鸭血嫩滑粉丝筋道，南京名小吃", "ingredients": [{"n": "鸭血", "a": "1盒"}, {"n": "鸭肠", "a": "100克"}, {"n": "鸭胗", "a": "2个"}, {"n": "红薯粉丝", "a": "1把"}, {"n": "鸭高汤", "a": "2碗"}, {"n": "香菜", "a": "少许"}, {"n": "盐", "a": "适量"}, {"n": "辣椒油", "a": "少许"}], "steps": ["鸭血切块，粉丝温水泡软，鸭肠鸭胗洗净切好。", "鸭高汤烧开，下鸭血块煮3分钟。", "加入鸭肠鸭胗煮2分钟，再下粉丝煮3分钟。", "加盐调味。", "盛出撒香菜，按喜好加辣椒油。"], "tips": "鸭血后下锅轻推，煮老会发柴，嫩而不腥。"},
{"id": "s4a31", "meal": "dinner", "name": "酸辣汤", "img": "assets/s4_31.jpg", "time": 20, "diff": 2, "kcal": 140, "tags": ["开胃", "暖胃"], "desc": "酸辣开胃料足汤浓，醒酒暖胃", "ingredients": [{"n": "豆腐", "a": "半块"}, {"n": "黑木耳", "a": "3朵"}, {"n": "火腿", "a": "50克"}, {"n": "鸡蛋", "a": "1个"}, {"n": "香醋", "a": "2勺"}, {"n": "白胡椒粉", "a": "1勺"}, {"n": "水淀粉", "a": "适量"}, {"n": "香菜", "a": "少许"}], "steps": ["豆腐木耳火腿切丝，鸡蛋打散。", "锅中加水烧开，下三丝煮2分钟。", "淋入水淀粉勾薄芡，转小火淋蛋液成蛋花。", "加香醋、白胡椒粉、盐调味。", "撒香菜出锅。"], "tips": "醋和胡椒关火后再加，酸香不挥发。"},
{"id": "s4a32", "meal": "dinner", "name": "胡辣汤", "img": "assets/s4_32.jpg", "time": 30, "diff": 2, "kcal": 180, "tags": ["河南味", "早餐"], "desc": "面筋牛肉胡椒浓郁，河南经典早餐", "ingredients": [{"n": "牛肉", "a": "100克"}, {"n": "洗面筋", "a": "50克"}, {"n": "黄花菜", "a": "1小把"}, {"n": "木耳", "a": "3朵"}, {"n": "粉条", "a": "1把"}, {"n": "白胡椒", "a": "1勺"}, {"n": "水淀粉", "a": "适量"}, {"n": "香醋", "a": "少许"}], "steps": ["牛肉切小丁焯水，黄花菜木耳泡发切好。", "锅中加牛骨汤或清水，下牛肉黄花菜木耳粉条煮5分钟。", "洗面筋撕成小块下锅。", "淋水淀粉勾浓芡，加白胡椒盐调味。", "淋少许香醋，撒葱花出锅。"], "tips": "白胡椒要足，勾芡分两次，浓稠挂勺最佳。"},
{"id": "s4a33", "meal": "dinner", "name": "西湖牛肉羹", "img": "assets/s4_33.jpg", "time": 25, "diff": 2, "kcal": 130, "tags": ["杭帮菜", "清淡"], "desc": "牛肉嫩滑羹汤鲜美，杭州名菜", "ingredients": [{"n": "牛里脊", "a": "150克"}, {"n": "嫩豆腐", "a": "半块"}, {"n": "香菇", "a": "3朵"}, {"n": "鸡蛋清", "a": "1个"}, {"n": "香菜", "a": "少许"}, {"n": "水淀粉", "a": "适量"}, {"n": "盐", "a": "适量"}, {"n": "白胡椒粉", "a": "少许"}], "steps": ["牛肉剁细用淀粉料酒抓匀，豆腐香菇切小丁。", "锅中加水或高汤烧开，下香菇豆腐丁煮2分钟。", "下牛肉末搅散煮1分钟。", "淋水淀粉勾薄芡，再淋蛋清成蛋花。", "加盐白胡椒，撒香菜出锅。"], "tips": "牛肉末先淀粉抓过，羹汤滑嫩不散。"},
{"id": "s4a34", "meal": "dinner", "name": "海鲜疙瘩汤", "img": "assets/s4_34.jpg", "time": 25, "diff": 2, "kcal": 220, "tags": ["鲜", "主食汤"], "desc": "面疙瘩滑海鲜鲜，暖胃一碗", "ingredients": [{"n": "面粉", "a": "100克"}, {"n": "虾仁", "a": "6只"}, {"n": "蛤蜊", "a": "10个"}, {"n": "番茄", "a": "1个"}, {"n": "鸡蛋", "a": "1个"}, {"n": "葱花", "a": "少许"}, {"n": "盐", "a": "适量"}, {"n": "香油", "a": "几滴"}], "steps": ["面粉淋少量水搅成小疙瘩；番茄切块。", "热油炒番茄出沙，加水烧开。", "撒入面疙瘩搅散煮3分钟，下虾仁蛤蜊。", "蛤蜊开口后淋蛋液成蛋花。", "加盐调味，撒葱花滴香油。"], "tips": "面疙瘩要小而匀，水淋慢些搅才不结块。"},
{"id": "s4a35", "meal": "dinner", "name": "罗宋汤", "img": "assets/s4_35.jpg", "time": 60, "diff": 2, "kcal": 240, "tags": ["西式", "酸甜"], "desc": "番茄牛肉蔬菜浓郁，酸甜暖汤", "ingredients": [{"n": "牛腩", "a": "200克"}, {"n": "番茄", "a": "2个"}, {"n": "土豆", "a": "1个"}, {"n": "胡萝卜", "a": "1根"}, {"n": "卷心菜", "a": "3叶"}, {"n": "洋葱", "a": "半个"}, {"n": "番茄酱", "a": "2勺"}, {"n": "盐", "a": "适量"}], "steps": ["牛腩切块焯水，蔬菜全部切块。", "热油炒香洋葱番茄至出沙，加番茄酱。", "倒入牛腩加热水，大火烧开转小火炖40分钟。", "加土豆胡萝卜卷心菜继续炖15分钟。", "加盐调味出锅。"], "tips": "番茄和番茄酱结合，红汤浓郁不寡淡。"},
{"id": "s4a36", "meal": "dinner", "name": "粉蒸排骨", "img": "assets/s4_36.jpg", "time": 60, "diff": 2, "kcal": 420, "tags": ["蒸菜", "下饭菜"], "desc": "米粉裹排骨软糯咸香，无油更健康", "ingredients": [{"n": "猪排骨", "a": "400克"}, {"n": "蒸肉米粉", "a": "100克"}, {"n": "土豆", "a": "1个"}, {"n": "姜末", "a": "少许"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "半勺"}, {"n": "豆瓣酱", "a": "1勺"}, {"n": "葱花", "a": "少许"}], "steps": ["排骨剁块加姜、生抽老抽豆瓣酱腌20分钟。", "拌入蒸肉米粉，让每块排骨均匀裹粉。", "土豆切片铺碗底，上面码好排骨。", "蒸锅水开后上锅，大火蒸45分钟至脱骨。", "倒扣撒葱花即可。"], "tips": "蒸碗底垫土豆红薯，吸油解腻又软糯。"},
{"id": "s4a37", "meal": "dinner", "name": "清蒸武昌鱼", "img": "assets/s4_37.jpg", "time": 20, "diff": 2, "kcal": 180, "tags": ["清蒸", "低脂"], "desc": "鱼肉嫩滑豉油提鲜，湖北名菜", "ingredients": [{"n": "武昌鱼", "a": "1条"}, {"n": "葱丝", "a": "适量"}, {"n": "姜丝", "a": "适量"}, {"n": "红椒丝", "a": "少许"}, {"n": "蒸鱼豉油", "a": "2勺"}, {"n": "料酒", "a": "1勺"}, {"n": "热油", "a": "1勺"}, {"n": "盐", "a": "少许"}], "steps": ["武昌鱼去鳞去内脏洗净，两面划刀，抹盐料酒腌10分钟。", "鱼身铺葱姜丝，蒸锅水开后上锅大火蒸8分钟。", "倒掉蒸出的腥水，拣去旧葱姜。", "重新铺葱丝红椒丝，淋蒸鱼豉油。", "浇一勺热油激出香味即可。"], "tips": "一斤左右的鱼大火蒸8分钟刚好，过老肉柴。"},
{"id": "s4a38", "meal": "dinner", "name": "清蒸多宝鱼", "img": "assets/s4_38.jpg", "time": 20, "diff": 2, "kcal": 170, "tags": ["清蒸", "低脂"], "desc": "肉嫩刺少豉油鲜，广式蒸法", "ingredients": [{"n": "多宝鱼", "a": "1条"}, {"n": "葱丝", "a": "适量"}, {"n": "姜丝", "a": "适量"}, {"n": "蒸鱼豉油", "a": "2勺"}, {"n": "料酒", "a": "1勺"}, {"n": "红椒丝", "a": "少许"}, {"n": "热油", "a": "1勺"}], "steps": ["多宝鱼去内脏洗净，划刀，抹料酒腌10分钟。", "鱼身铺葱姜丝，蒸锅水开上锅大火蒸8分钟。", "倒去腥水，拣去旧葱姜。", "重新铺葱丝红椒丝，淋蒸鱼豉油。", "浇热油激香即可。"], "tips": "多宝鱼皮厚，蒸时盘底架筷子让蒸汽流通。"},
{"id": "s4a39", "meal": "dinner", "name": "蒜蓉蒸虾", "img": "assets/s4_39.jpg", "time": 15, "diff": 1, "kcal": 160, "tags": ["快手", "海鲜"], "desc": "蒜香四溢虾肉Q弹，快手宴客菜", "ingredients": [{"n": "大虾", "a": "10只"}, {"n": "大蒜", "a": "1头"}, {"n": "粉丝", "a": "1把"}, {"n": "葱花", "a": "少许"}, {"n": "生抽", "a": "1勺"}, {"n": "蚝油", "a": "半勺"}, {"n": "热油", "a": "1勺"}, {"n": "盐", "a": "少许"}], "steps": ["虾开背去虾线，粉丝泡软铺盘底。", "大虾摆粉丝上，蒜剁蓉一半用热油浇香，加生抽蚝油调成蒜蓉酱。", "蒜蓉酱铺在虾背上。", "蒸锅水开上锅大火蒸6分钟。", "撒葱花浇一勺热油即可。"], "tips": "金银蒜（生蒜+炸蒜）搭配，香气更有层次。"},
{"id": "s4a40", "meal": "dinner", "name": "蒜蓉粉丝蒸扇贝", "img": "assets/s4_40.jpg", "time": 15, "diff": 1, "kcal": 150, "tags": ["海鲜", "宴客"], "desc": "扇贝鲜甜粉丝吸汁，蒜蓉提味", "ingredients": [{"n": "扇贝", "a": "6只"}, {"n": "大蒜", "a": "1头"}, {"n": "粉丝", "a": "1把"}, {"n": "葱花", "a": "少许"}, {"n": "红椒末", "a": "少许"}, {"n": "生抽", "a": "1勺"}, {"n": "热油", "a": "1勺"}], "steps": ["扇贝刷洗干净，去掉半边壳，粉丝泡软铺在贝肉上。", "蒜剁蓉一半炸至金黄，与生蒜混合加生抽调成蒜蓉酱。", "蒜蓉酱铺在粉丝和贝肉上。", "蒸锅水开上锅大火蒸6分钟。", "撒葱花红椒末，浇热油激香。"], "tips": "蒸制时间别超6分钟，贝肉老了缩成球。"},
{"id": "s4a41", "meal": "dinner", "name": "剁椒鱼头", "img": "assets/s4_41.jpg", "time": 25, "diff": 2, "kcal": 260, "tags": ["湘菜", "下饭"], "desc": "鱼头鲜辣剁椒红亮，湘菜代表", "ingredients": [{"n": "鳙鱼头", "a": "1个"}, {"n": "剁椒", "a": "4勺"}, {"n": "姜蒜末", "a": "适量"}, {"n": "葱花", "a": "少许"}, {"n": "料酒", "a": "1勺"}, {"n": "生抽", "a": "1勺"}, {"n": "热油", "a": "1勺"}], "steps": ["鱼头去鳃洗净对半剖开不切断，抹料酒腌10分钟。", "盘底铺葱姜，鱼头摆上，均匀铺满剁椒和姜蒜末。", "蒸锅水开上锅大火蒸12分钟。", "取出撒葱花，淋生抽。", "浇一勺滚烫热油激香即可。"], "tips": "鱼头先腌去腥味，蒸好后热油一定要烫。"},
{"id": "s4a42", "meal": "dinner", "name": "豆豉蒸排骨", "img": "assets/s4_42.jpg", "time": 30, "diff": 1, "kcal": 320, "tags": ["粤式", "蒸菜"], "desc": "豉香浓郁排骨嫩滑，广式早茶味", "ingredients": [{"n": "猪排骨", "a": "400克"}, {"n": "豆豉", "a": "1勺"}, {"n": "蒜末", "a": "适量"}, {"n": "姜末", "a": "适量"}, {"n": "生抽", "a": "1勺"}, {"n": "生粉", "a": "1勺"}, {"n": "白糖", "a": "少许"}, {"n": "葱花", "a": "少许"}], "steps": ["排骨剁小段泡水去血水，沥干。", "加豆豉、姜蒜、生抽、糖、生粉、少许油抓匀腌15分钟。", "铺在盘中，蒸锅水开上锅大火蒸20分钟。", "蒸至排骨脱骨。", "撒葱花出锅。"], "tips": "排骨先泡水去血水，颜色更白净不腥。"},
{"id": "s4a43", "meal": "dinner", "name": "梅菜蒸肉饼", "img": "assets/s4_43.jpg", "time": 30, "diff": 1, "kcal": 350, "tags": ["客家菜", "下饭"], "desc": "梅菜咸香肉饼滑嫩，客家家常菜", "ingredients": [{"n": "五花肉", "a": "250克"}, {"n": "梅干菜", "a": "50克"}, {"n": "姜末", "a": "少许"}, {"n": "生抽", "a": "1勺"}, {"n": "生粉", "a": "1勺"}, {"n": "白糖", "a": "少许"}, {"n": "葱花", "a": "少许"}, {"n": "食用油", "a": "少许"}], "steps": ["梅干菜泡发洗净切碎，五花肉剁成肉糜。", "肉糜加梅菜、姜、生抽、糖、生粉、少许水搅打上劲。", "压成饼状装盘，中间稍压凹。", "蒸锅水开上锅大火蒸20分钟。", "撒葱花出锅。"], "tips": "肉糜顺一个方向搅打上劲，肉饼更弹嫩。"},
{"id": "s4a44", "meal": "dinner", "name": "蒸蛋羹", "img": "assets/s4_44.jpg", "time": 15, "diff": 1, "kcal": 120, "tags": ["清淡", "快手"], "desc": "嫩滑如布丁，老少皆宜", "ingredients": [{"n": "鸡蛋", "a": "2个"}, {"n": "温水", "a": "1.5倍蛋液"}, {"n": "盐", "a": "少许"}, {"n": "生抽", "a": "半勺"}, {"n": "香油", "a": "几滴"}, {"n": "葱花", "a": "少许"}], "steps": ["鸡蛋打散，加温水和少许盐搅匀。", "蛋液过筛去浮沫，盖上保鲜膜扎孔。", "蒸锅水开后放入，中小火蒸10分钟。", "关火焖2分钟取出。", "淋生抽香油，撒葱花。"], "tips": "蛋液过筛+盖膜，蒸出来无气孔如镜面。"},
{"id": "s4a45", "meal": "dinner", "name": "肉沫蒸蛋", "img": "assets/s4_45.jpg", "time": 20, "diff": 1, "kcal": 220, "tags": ["下饭", "家常"], "desc": "蛋羹嫩滑肉沫咸香，下饭神器", "ingredients": [{"n": "鸡蛋", "a": "2个"}, {"n": "猪肉末", "a": "100克"}, {"n": "温水", "a": "适量"}, {"n": "生抽", "a": "1勺"}, {"n": "葱花", "a": "少许"}, {"n": "蚝油", "a": "半勺"}, {"n": "水淀粉", "a": "少许"}, {"n": "香油", "a": "几滴"}], "steps": ["鸡蛋加温水盐打散过筛，盖膜中小火蒸10分钟成蛋羹。", "热锅下肉末炒散至变色。", "加生抽蚝油和少许水煮开，淋水淀粉勾薄芡。", "把肉沫浇在蒸好的蛋羹上。", "撒葱花滴香油。"], "tips": "肉沫炒香再勾薄芡，浇在蛋羹上咸香入味。"},
{"id": "s4a46", "meal": "dinner", "name": "清蒸鳕鱼", "img": "assets/s4_46.jpg", "time": 15, "diff": 1, "kcal": 150, "tags": ["低脂", "宝宝餐"], "desc": "肉白细嫩蒸着吃，营养低脂", "ingredients": [{"n": "鳕鱼块", "a": "200克"}, {"n": "葱丝", "a": "适量"}, {"n": "姜丝", "a": "适量"}, {"n": "蒸鱼豉油", "a": "2勺"}, {"n": "料酒", "a": "1勺"}, {"n": "热油", "a": "1勺"}, {"n": "红椒丝", "a": "少许"}], "steps": ["鳕鱼解冻用厨房纸吸干，抹料酒腌5分钟。", "鱼块铺盘，上面放葱姜丝。", "蒸锅水开上锅大火蒸6分钟。", "倒掉腥水，重新铺葱丝红椒丝，淋蒸鱼豉油。", "浇一勺热油激香。"], "tips": "鳕鱼水分大，蒸前务必吸干，蒸制别超6分钟。"},
{"id": "s4a47", "meal": "dinner", "name": "腊味合蒸", "img": "assets/s4_47.jpg", "time": 40, "diff": 1, "kcal": 450, "tags": ["湘菜", "腊味"], "desc": "腊肉腊鱼腊鸡同蒸，湖南风味", "ingredients": [{"n": "腊肉", "a": "100克"}, {"n": "腊鱼", "a": "100克"}, {"n": "腊鸡", "a": "100克"}, {"n": "干辣椒", "a": "3个"}, {"n": "姜片", "a": "3片"}, {"n": "豆豉", "a": "1勺"}, {"n": "料酒", "a": "1勺"}, {"n": "葱花", "a": "少许"}], "steps": ["腊肉腊鱼腊鸡温水洗净，切块。", "分别焯水5分钟去咸，捞出沥干。", "在碗中码好腊味，撒姜片豆豉干辣椒。", "蒸锅水开上锅大火蒸30分钟。", "取出倒扣撒葱花。"], "tips": "腊味先焯水减咸，蒸后油润不齁。"},
{"id": "s4a48", "meal": "dinner", "name": "红烧带鱼", "img": "assets/s4_48.jpg", "time": 25, "diff": 2, "kcal": 300, "tags": ["下饭菜", "家常"], "desc": "外焦里嫩浓汁裹鱼，家常红烧", "ingredients": [{"n": "带鱼", "a": "400克"}, {"n": "葱姜", "a": "适量"}, {"n": "蒜", "a": "3瓣"}, {"n": "生抽", "a": "2勺"}, {"n": "老抽", "a": "半勺"}, {"n": "香醋", "a": "1勺"}, {"n": "料酒", "a": "1勺"}, {"n": "白糖", "a": "少许"}], "steps": ["带鱼切段洗净，用厨房纸吸干，腌10分钟。", "热油下鱼段煎至两面金黄盛出。", "锅留底油爆香姜蒜，加生抽老抽糖醋和热水。", "放入鱼段中火炖10分钟入味。", "大火收浓汤汁撒葱花。"], "tips": "鱼先吸干再煎，热油下锅不粘皮。"},

{"id": "s4a50", "meal": "dinner", "name": "干煎带鱼", "img": "assets/s4_50.jpg", "time": 20, "diff": 1, "kcal": 280, "tags": ["快手", "咸香"], "desc": "皮酥肉嫩干香入味，少油快手", "ingredients": [{"n": "带鱼", "a": "400克"}, {"n": "盐", "a": "适量"}, {"n": "料酒", "a": "1勺"}, {"n": "姜片", "a": "3片"}, {"n": "白胡椒粉", "a": "少许"}, {"n": "淀粉", "a": "适量"}, {"n": "葱花", "a": "少许"}, {"n": "食用油", "a": "适量"}], "steps": ["带鱼切段加姜片料酒盐白胡椒腌15分钟，吸干水分。", "两面拍薄薄一层淀粉。", "平底锅热油，下鱼段中火煎。", "一面煎黄后再翻面，煎至两面金黄。", "出锅撒葱花。"], "tips": "一面煎定型再翻面，勤翻会碎。"},

{"id": "s4a60", "meal": "dinner", "name": "油焖大虾", "img": "assets/s4_60.jpg", "time": 15, "diff": 1, "kcal": 230, "tags": ["海鲜", "宴客"], "desc": "虾壳红亮酱香鲜甜，宴客硬菜", "ingredients": [{"n": "大虾", "a": "12只"}, {"n": "番茄酱", "a": "2勺"}, {"n": "生抽", "a": "1勺"}, {"n": "白糖", "a": "1勺"}, {"n": "姜", "a": "2片"}, {"n": "蒜", "a": "2瓣"}, {"n": "葱花", "a": "少许"}, {"n": "料酒", "a": "1勺"}], "steps": ["大虾剪须开背去虾线，洗净吸干。", "热油将虾煎至变红酥脆。", "加姜蒜、番茄酱、生抽、糖、料酒和少许水。", "中火焖3分钟至汤汁浓稠裹虾。", "撒葱花出锅。"], "tips": "虾煎到壳酥脆，连壳吃更香。"},

{"id": "s4a66", "meal": "dinner", "name": "砂锅豆腐", "img": "assets/s4_66.jpg", "time": 30, "diff": 1, "kcal": 220, "tags": ["煲菜", "下饭"], "desc": "豆腐入味暖呼呼，砂锅煲菜", "ingredients": [{"n": "北豆腐", "a": "1块"}, {"n": "五花肉", "a": "100克"}, {"n": "青椒", "a": "1个"}, {"n": "木耳", "a": "3朵"}, {"n": "蒜", "a": "3瓣"}, {"n": "生抽", "a": "2勺"}, {"n": "豆瓣酱", "a": "1勺"}, {"n": "葱段", "a": "适量"}], "steps": ["豆腐切厚片煎至两面金黄。", "五花肉切片煸出油，加姜蒜豆瓣酱炒香。", "转入砂锅，放豆腐、木耳，加热水和生抽。", "大火烧开转小火炖15分钟。", "加青椒段略煮，撒葱花。"], "tips": "豆腐先煎再炖，不易碎且吸味。"},

{"id": "s4a69", "meal": "dinner", "name": "砂锅丸子", "img": "assets/s4_69.jpg", "time": 30, "diff": 2, "kcal": 280, "tags": ["煲菜", "暖胃"], "desc": "丸子弹嫩配菜吸汤，砂锅暖菜", "ingredients": [{"n": "猪肉末", "a": "250克"}, {"n": "大白菜", "a": "3叶"}, {"n": "粉丝", "a": "1把"}, {"n": "姜末", "a": "适量"}, {"n": "葱花", "a": "少许"}, {"n": "盐", "a": "适量"}, {"n": "白胡椒粉", "a": "少许"}, {"n": "香油", "a": "几滴"}], "steps": ["肉末加姜末盐和水搅打上劲，挤成丸子。", "砂锅底铺白菜和粉丝。", "热水烧温，下入丸子浸熟。", "转入砂锅小火炖15分钟。", "加盐白胡椒，撒葱花滴香油。"], "tips": "冷水或温水下丸子，小火浸熟更弹嫩。"},
{"id": "s4a70", "meal": "dinner", "name": "腊味煲仔饭", "img": "assets/s4_70.jpg", "time": 35, "diff": 2, "kcal": 520, "tags": ["粤式", "主食"], "desc": "锅巴焦香腊味油润，经典煲仔饭", "ingredients": [{"n": "大米", "a": "1杯"}, {"n": "广式腊肠", "a": "2根"}, {"n": "腊肉", "a": "100克"}, {"n": "青菜", "a": "2棵"}, {"n": "鸡蛋", "a": "1个"}, {"n": "生抽", "a": "2勺"}, {"n": "蚝油", "a": "半勺"}, {"n": "香油", "a": "少许"}], "steps": ["大米浸泡30分钟，入砂锅加水煮至水分收干。", "腊味切片铺在米饭上，中间打一个蛋。", "沿锅边淋一圈油，小火焖12分钟出饭焦。", "青菜焯熟摆入，淋生抽蚝油香油调成的酱汁。", "拌匀即可。"], "tips": "砂锅先抹油防粘，小火慢焖才有焦香锅巴。"},
{"id": "s4a71", "meal": "dinner", "name": "滑鸡煲仔饭", "img": "assets/s4_71.jpg", "time": 35, "diff": 2, "kcal": 500, "tags": ["粤式", "主食"], "desc": "鸡肉嫩滑饭香入味，家常煲仔饭", "ingredients": [{"n": "大米", "a": "1杯"}, {"n": "鸡腿肉", "a": "200克"}, {"n": "干香菇", "a": "3朵"}, {"n": "姜丝", "a": "适量"}, {"n": "生抽", "a": "2勺"}, {"n": "蚝油", "a": "1勺"}, {"n": "淀粉", "a": "1勺"}, {"n": "葱花", "a": "少许"}], "steps": ["大米浸泡30分钟入砂锅煮至水分收干。", "鸡腿肉切块加香菇姜丝生抽蚝油淀粉腌15分钟。", "把腌好的鸡肉铺在米饭上，小火焖12分钟。", "焖至鸡肉熟透、锅底出现饭焦。", "淋酱汁撒葱花拌匀。"], "tips": "鸡肉提前腌入味，铺饭上一起焖嫩而不柴。"},

{"id": "s8a02", "meal": "dinner", "name": "刺身", "img": "assets/s8_02.jpg", "time": 20, "diff": 1, "kcal": 280, "tags": ["日料", "生冷"], "desc": "海鲜薄切冰镇拼盘，原汁原味", "ingredients": [{"n": "三文鱼", "a": "100克"}, {"n": "金枪鱼", "a": "100克"}, {"n": "甜虾", "a": "6只"}, {"n": "北极贝", "a": "4片"}, {"n": "白萝卜丝", "a": "适量"}, {"n": "山葵", "a": "1小勺"}, {"n": "刺身酱油", "a": "2勺"}], "steps": ["鱼肉提前冷冻杀菌，冷藏解冻。", "鱼肉逆纹切0.5厘米薄片，甜虾去壳留尾。", "冰盘上铺萝卜丝，鱼片扇形摆好。", "点缀山葵叶，蘸酱油山葵食用。"], "tips": "刀要快一气切下，断面平整才显新鲜。"},

{"id": "s8a05", "meal": "lunch", "name": "鳗鱼饭", "img": "assets/s8_05.jpg", "time": 25, "diff": 2, "kcal": 580, "tags": ["日料", "蒲烧"], "desc": "蒲烧鳗鱼盖浇米饭，酱浓脂香", "ingredients": [{"n": "蒲烧鳗鱼", "a": "1条"}, {"n": "米饭", "a": "一碗"}, {"n": "鳗鱼酱汁", "a": "3勺"}, {"n": "白芝麻", "a": "少许"}, {"n": "海苔丝", "a": "少许"}, {"n": "山椒粉", "a": "少许"}], "steps": ["鳗鱼解冻，平底锅小火两面各煎3分钟至焦香。", "刷蒲烧酱汁焖煮2分钟入味。", "米饭盛入碗，鳗鱼切段铺饭上。", "再刷一层酱汁，撒白芝麻海苔丝。"], "tips": "煎鳗鱼皮朝下先定型，酱汁最后收汁浓稠。"},

{"id": "s10a03", "meal": "snack", "name": "壮族五色糯米饭", "img": "assets/s10_03.jpg", "time": 200, "diff": 3, "kcal": 280, "tags": ["壮族", "植物染色", "节庆"], "desc": "壮族三月三美食，天然植物汁染出五彩糯米饭", "ingredients": [{"n": "糯米", "a": "500g"}, {"n": "红蓝草(红)", "a": "30g"}, {"n": "密蒙花(黄)", "a": "20g"}, {"n": "枫叶(黑)", "a": "30g"}, {"n": "紫蓝草", "a": "20g"}, {"n": "白糖", "a": "适量"}], "steps": ["糯米分成五份，分别用清水浸泡", "红蓝草、紫蓝草煮汁滤出，分别泡米染出红与紫", "密蒙花煮汁泡米染黄；枫叶捣汁静置泡米染黑", "剩余一份原米留白", "五色米分别大火蒸25分钟至熟，拼摆成五彩色"], "tips": "枫叶汁需静置一夜染黑才匀，全为可食用植物染料。"},

/* ================= 状态 ================= */
const $ = s => document.querySelector(s);
const R = {}; RECIPES.forEach(r => R[r.id] = r);
const LS = { favs:'sf3_favs', cats:'sf3_cats', last:'sf3_last' };
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const state = {
  favs: load(LS.favs, {}),                    // {recipeId: catName}
  cats: load(LS.cats, ['我的最爱','想做','做过','减脂']),
  last: load(LS.last, {}),                    // {meal: recipeId}
  deck: {}, pos: {},                          // 每餐的洗牌队列与指针
  route: 'home', curMeal: 'breakfast'
};

/* ================= 时段逻辑 ================= */
const WINDOWS = [
  {k:'breakfast', s:300,  e:600},
  {k:'lunch',     s:600,  e:900},
  {k:'dinner',    s:900,  e:1260},
  {k:'snack',     s:1260, e:1440},
  {k:'snack',     s:0,    e:300}
];
function mealAt(d){
  const m = d.getHours()*60 + d.getMinutes();
  for(const w of WINDOWS){ if(m>=w.s && m<w.e) return w.k; }
  return 'snack';
}
function nextMealInfo(d){
  const m = d.getHours()*60 + d.getMinutes();
  const order = ['breakfast','lunch','dinner','snack'];
  const cur = mealAt(d);
  let idx = order.indexOf(cur);
  let next = order[(idx+1)%4];
  let start = {breakfast:300, lunch:600, dinner:900, snack:1260}[next];
  let mins = start - m;
  if(mins <= 0) mins += 1440;
  return {next, mins};
}
function fmtCountdown(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return h>0 ? `${h} 小时 ${m} 分` : `${m} 分钟`;
}

/* ================= 洗牌（低重复） ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function poolOf(meal){ return RECIPES.filter(r=>r.meal===meal).map(r=>r.id); }
function ensureDeck(meal){
  if(!state.deck[meal] || state.deck[meal].length===0){
    let pool = poolOf(meal);
    const last = state.last[meal];
    if(pool.length>1 && last){
      pool = shuffle(pool);
      const i = pool.indexOf(last);
      if(i>0){ pool.splice(i,1); pool.push(last); }   // 上次看过的排到队尾
    } else {
      pool = shuffle(pool);
    }
    state.deck[meal] = pool; state.pos[meal] = 0;
  }
  return state.deck[meal];
}
function currentId(meal){
  const d = ensureDeck(meal);
  const id = d[Math.min(state.pos[meal]||0, d.length-1)];
  state.last[meal] = id; save(LS.last, state.last);
  return id;
}
function moveId(meal, dir){          // dir: +1 下一道 / -1 上一道
  const d = ensureDeck(meal);
  let p = (state.pos[meal]||0) + dir;
  if(p < 0) p = d.length - 1;
  if(p >= d.length){
    // 一轮看完，重洗（当前这道排到队尾，保证不立刻重复）
    const cur = d[d.length-1];
    let pool = poolOf(meal).filter(x=>x!==cur);
    state.deck[meal] = shuffle(pool).concat([cur]);
    state.pos[meal] = 0;
  } else {
    state.pos[meal] = p;
  }
  return currentId(meal);
}
function refreshId(meal){ return moveId(meal, +1); }

/* ================= 路由 ================= */
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  if(h.startsWith('recipe/')) return {name:'recipe', id: h.slice(7)};
  if(h === 'library') return {name:'library'};
  if(h === 'fav') return {name:'fav'};
  if(h === 'me') return {name:'me'};
  if(h === 'prep') return {name:'prep'};
  if(h === 'order' || h.startsWith('order')){
    const qs = h.indexOf('?') >= 0 ? h.slice(h.indexOf('?') + 1) : '';
    const af = new URLSearchParams(qs).get('addfriend');
    if(af) pendingAdd = af;
    return {name:'order'};
  }
  return {name:'home'};
}
function router(){
  const r = parseRoute();
  state.route = r.name;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('on', b.dataset.nav === (r.name==='recipe' ? '' : r.name) || (r.name==='recipe' && b.dataset.nav==='home')));
  $('#main').innerHTML = '';
  if(r.name==='home') renderHome();
  else if(r.name==='library') renderLibrary();
  else if(r.name==='fav') renderFav();
  else if(r.name==='recipe') renderDetail(r.id);
  else if(r.name==='order') renderOrder();
  else if(r.name==='me') renderMe();
  else if(r.name==='prep') renderPrep();
  updatePrepBadge();
}

/* ================= 卡片手势 ================= */
function bindCardGestures(card, meal){
  let sx=0, sy=0, dx=0, dy=0, active=false, mode=null;
  const hint = $('#refreshHint');
  function start(x,y){ sx=x; sy=y; dx=0; dy=0; active=true; mode=null; card.classList.add('dragging'); }
  function move(x,y){
    if(!active) return;
    dx = x-sx; dy = y-sy;
    if(!mode){
      if(Math.abs(dx)>12 || Math.abs(dy)>12) mode = Math.abs(dx)>Math.abs(dy) ? 'h' : 'v';
    }
    if(mode==='h'){
      card.style.transform = `translateX(${dx*0.9}px)`;
    } else if(mode==='v' && dy>0){
      card.style.transform = `translateY(${dy*0.45}px)`;
      if(dy>70){ hint.classList.add('show'); } else { hint.classList.remove('show'); }
    }
  }
  function end(){
    if(!active) return;
    active=false; card.classList.remove('dragging'); hint.classList.remove('show');
    if(mode==='h' && Math.abs(dx)>60){
      const dir = dx<0 ? +1 : -1;
      card.dataset.swiped = '1';
      animateSwitch(meal, dir, dx<0?'left':'right');
    } else if(mode==='v' && dy>70 && Math.abs(dy)>Math.abs(dx)){
      card.dataset.swiped = '1';
      animateRefresh(meal);
    } else {
      card.style.transform = '';
    }
    mode=null;
  }
  // touch
  card.addEventListener('touchstart', e => { start(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  card.addEventListener('touchmove', e => { move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
  card.addEventListener('touchend', () => end(), {passive:true});
  // mouse（桌面端）
  card.addEventListener('mousedown', e => { if(e.button!==0) return; start(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e => { if(active) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if(active) end(); });
}
function animateSwitch(meal, dir, side){
  const card = $('#recipeCard');
  card.style.transform = '';
  moveId(meal, dir);
  setTimeout(() => {
    renderHome();
    const c = $('#recipeCard');
    c.classList.add(side==='left'?'anim-left':'anim-right');
  }, 60);
}
function animateRefresh(meal){
  const card = $('#recipeCard');
  card.style.transform = '';
  refreshId(meal);
  setTimeout(() => {
    renderHome();
    const c = $('#recipeCard');
    c.classList.add('anim-up');
    toast('已换一道新食谱');
  }, 60);
}
